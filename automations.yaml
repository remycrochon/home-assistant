  - action: ai_task.generate_data
    continue_on_error: true
    response_variable: recap_energie
    data:
      task_name: recap energie journalier complet
      entity_id: ai_task.google_ai_task
      instructions: 'Tu es un assistant énergie domestique. Tu ne dois JAMAIS produire
        de chiffres, pourcentages ou unités (kWh, %, €, V, A) : toutes les valeurs
        numériques seront ajoutées séparément par le système. Rédige uniquement des
        commentaires qualitatifs très courts, en français, sans emoji, sans jamais
        réutiliser, arrondir ou paraphraser un nombre fourni en contexte.

        Contexte du jour (pour information seulement, ne recopie aucune de ces valeurs
        dans tes réponses) : - Poste Tempo dominant : {{ poste_dominant }} - Couleur
        Tempo demain : {{ couleur_demain }} - Production prévue {{ previ_prod_jour
        }} kWh vs réalisée {{ realise_prod_jour }} kWh (écart {{ ecart_prod_pct_txt
        }}) - Consommation 6-22h prévue {{ previ_conso_6_22 }} kWh vs réalisée {{
        realise_conso_6_22 }} kWh (écart {{ ecart_conso_6_22_pct_txt }}) - Autonomie
        solaire {{ taux_autonomie_solaire }} %, autoconsommation {{ taux_autoconsommation_solaire
        }} % - Batterie mini/maxi du jour {{ bat_min_txt }} / {{ bat_max_txt }}

        Pour chaque champ demandé, rédige une seule phrase courte (maximum 12 mots),
        sans aucun chiffre, uniquement une appréciation qualitative. Exemples de style
        attendu (ne pas recopier tel quel) : "Production nettement supérieure aux
        prévisions du jour." ou "Consommation maîtrisée malgré les températures basses."'
      structure:
        titre:
          description: Titre très court du message Telegram, sans aucun chiffre
          required: true
          selector:
            text:
        analyse_production:
          description: Une phrase qualitative courte comparant la production prévue
            et réalisée, sans aucun chiffre ni unité
          required: true
          selector:
            text:
        analyse_consommation:
          description: Une phrase qualitative courte comparant la consommation 6-22h
            prévue et réalisée, sans aucun chiffre ni unité
          required: true
          selector:
            text:
        conseil_demain:
          description: Un conseil très court pour demain selon la couleur Tempo, sans
            aucun chiffre
          required: true
          selector:
            text:
        niveau:
          description: Niveau global parmi INFO, VIGILANCE ou ALERTE
          required: true
          selector:
            text:
  - choose:
    - conditions:
      - condition: template
        value_template: "{{\n  recap_energie is defined and\n  recap_energie.data
          is defined and\n  recap_energie.data.titre is defined and\n  recap_energie.data.analyse_production
