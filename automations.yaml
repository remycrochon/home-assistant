      duree_previ_min: '{{ snap.dm }}'
      forcage_etait_actif: '{{ snap.fa }}'
      niveau_forcage_previ: '{{ snap.nf }}'
      previ_prod_demain_22h: '{{ snap.pd }}'
      gain_soc_nuit: '{{ (soc_actuel_6h - soc_prevu_0545_sans_charge) | round(1) }}'
      ecart_vs_cible_txt: '{{ ''%+.1f'' | format((soc_actuel_6h - soc_cible_22h) |
        round(1)) }} %'
      ecart_vs_previ_sans_charge_txt: '{{ ''%+.1f'' | format((soc_actuel_6h - soc_prevu_0545_sans_charge)
        | round(1)) }} %'
      charge_a_eu_lieu: '{{ ''oui'' if gain_soc_nuit > (besoin_corrige_pct * 0.5)
        else ''non ou partielle'' }}'
      linky_kwh_22h: '{{ snap.lk | float(0) | round(2) }}'
      linky_kwh_6h: '{{ states(''sensor.linky_hphc_kwh'') | float(0) | round(2) }}'
      conso_nuit_kwh: '{{ (linky_kwh_6h - linky_kwh_22h) | round(2) }}'
  - action: ai_task.generate_data
    continue_on_error: true
    response_variable: rapport_bilan_ia
    data:
      task_name: rapport bilan nuit 6h
      entity_id: ai_task.google_ai_task
      instructions: 'Tu es un assistant énergie domestique. Tu ne dois JAMAIS produire
        de chiffres, pourcentages, unités ou horaires : toutes les valeurs numériques
        sont déjà affichées séparément. Ton seul travail est de juger si la nuit s''est
        déroulée conformément à la prévision faite hier à 22h, et de le dire en une
        phrase très courte (maximum 15 mots), sans jamais réutiliser ou paraphraser
        un nombre fourni ci-dessous.

        Contexte (pour information seulement, ne recopie aucune valeur) : - SOC cible
        fixé hier soir : {{ soc_cible_22h }} % - SOC atteint ce matin : {{ soc_actuel_6h
        }} % - Ecart au SOC cible : {{ ecart_vs_cible_txt }} - SOC prévu sans charge
        (si rien n''avait chargé) : {{ soc_prevu_0545_sans_charge }} % - Ecart au
        SOC "sans charge" : {{ ecart_vs_previ_sans_charge_txt }} - Une charge était-elle
        jugée nécessaire hier soir : {{ ''oui'' if besoin_corrige_pct > 0 else ''non''
        }} - Charge estimée avoir eu lieu cette nuit : {{ charge_a_eu_lieu }} - Forçage
        actif hier soir : {{ forcage_etait_actif }} - Consommation réseau pendant
        la nuit : {{ conso_nuit_kwh }} kWh

        Si aucune charge n''était jugée nécessaire hier soir ET que l''écart au SOC
        "sans charge" dépasse 5 points en valeur absolue, signale explicitement que
        la décharge nocturne a été significativement différente du modèle habituel
        (plus forte ou plus faible que prévu), même si la cible est atteinte — ne
        conclus jamais "conforme" dans ce cas.

        Exemples de style attendu (ne pas recopier tel quel) : "Nuit conforme à la
        prévision, cible atteinte." ou "Charge plus faible que prévu, cible non atteinte."
        ou "Charge plus importante que prévu, à vérifier."'
      structure:
        titre:
          description: Titre très court du message Telegram, sans aucun chiffre
          required: true
          selector:
            text:
        commentaire_bilan:
          description: Une phrase courte jugeant si la nuit s'est déroulée conformément
            à la prévision de 22h, sans aucun chiffre ni unité
          required: true
          selector:
            text:
        niveau:
          description: Niveau global parmi INFO, VIGILANCE ou ALERTE
          required: true
          selector:
            text:
  - choose:
    - conditions:
      - condition: template
        value_template: "{{\n  rapport_bilan_ia is defined and\n  rapport_bilan_ia.data
          is defined and\n  rapport_bilan_ia.data.titre is defined and\n  rapport_bilan_ia.data.commentaire_bilan
          is defined\n}}"
      sequence:
      - action: telegram_bot.send_message
        metadata: {}
        data:
          config_entry_id: 01JZDD4YV6TJXXZ0BGJ3BDGD5A
          title: '{{ rapport_bilan_ia.data.titre }}'
          message: "    {{ date_snapshot }}{{-\"\\n\"-}}\n    Hier 22h : cible {{
            soc_cible_22h }} % / SOC {{ soc_actuel_22h }} %{{-\"\\n\"-}}\n    Ce matin
            : SOC {{ soc_actuel_6h }} %{{-\"\\n\"-}}\n    Ecart vs cible = {{ ecart_vs_cible_txt
            }}{{-\"\\n\"-}}\n    Ecart vs \"sans charge\" = {{ ecart_vs_previ_sans_charge_txt
            }}{{-\"\\n\"-}}\n    {% if besoin_corrige_pct > 0 %}Charge prévue hier
            = {{ heure_debut_previ }} → durée ~{{ duree_previ_min }} min{% else %}Aucune
            charge nécessaire hier soir{% endif %}{{-\"\\n\"-}}\n    Conso réseau
            nuit = {{ conso_nuit_kwh }} kWh{{-\"\\n\"-}}\n    {{ rapport_bilan_ia.data.commentaire_bilan
            }}{{-\"\\n\"-}}\n    Niveau = {{ rapport_bilan_ia.data.niveau if rapport_bilan_ia.data.niveau
            is defined else 'INFO' }}\n"
    default:
    - action: telegram_bot.send_message
      metadata: {}
      data:
        config_entry_id: 01JZDD4YV6TJXXZ0BGJ3BDGD5A
        title: Rapport 06h Bilan nuit
        message: "    {{ date_snapshot }}{{-\"\\n\"-}}\n    Hier 22h : cible {{ soc_cible_22h
          }} % / SOC {{ soc_actuel_22h }} %{{-\"\\n\"-}}\n    Ce matin : SOC {{ soc_actuel_6h
          }} %{{-\"\\n\"-}}\n    Ecart vs cible = {{ ecart_vs_cible_txt }}{{-\"\\n\"-}}\n
          \   Ecart vs \"sans charge\" = {{ ecart_vs_previ_sans_charge_txt }}{{-\"\\n\"-}}\n
          \   {% if besoin_corrige_pct > 0 %}Charge prévue hier = {{ heure_debut_previ
          }} → durée ~{{ duree_previ_min }} min{% else %}Aucune charge nécessaire
          hier soir{% endif %}{{-\"\\n\"-}}\n    Conso réseau nuit = {{ conso_nuit_kwh
          }} kWh\n"
  mode: single
- id: '1788110290374'
  alias: ESP129 - Auto-correction tare chlore après reboot
  description: Si l'ESP129 redémarre et ne restaure pas la tare depuis la flash, l'offset
    repart sur sa valeur YAML par défaut (-10000 g), ce qui fausse le poids de chlore
    de +11,3 kg pendant des heures (incident du 29/08/2026). Cette automatisation
    détecte ce retour à la valeur par défaut et corrige immédiatement l'offset avec
    la dernière tare connue, puis notifie Remy.
  triggers:
  - trigger: state
    entity_id: number.esp129_pesage_chlore_offset_poids_chlore
    to: '-10000.0'
  actions:
  - action: number.set_value
    target:
      entity_id: number.esp129_pesage_chlore_offset_poids_chlore
    data:
      value: 1284.504
    note: Dernière tare connue et valide, restaurée le 30/08/2026 après l'incident
      du 29/08.
  - action: telegram_bot.send_message
    data:
      config_entry_id: 01JZDD4YV6TJXXZ0BGJ3BDGD5A
      title: ESP129 - Pesage chlore
      message: '⚠️ L''offset de tare est revenu à sa valeur par défaut (-10000 g)
        après un reboot de l''ESP129 (probable échec de restauration flash). Correction
        automatique appliquée : offset remis à 1284,504 g. Vérifie que le poids affiché
        est cohérent.'
- id: '1788193581217'
  alias: Nouvelle capacité batterie mesurée
  description: Notifie via Telegram quand le flow Node-RED 'Calcul Capa Batteries'
    termine un cycle de mesure (passage à l'état DONE), avec la valeur mesurée et
    la date.
  triggers:
  - trigger: state
    entity_id: sensor.calcul_capa_batteries_phase
    to: DONE
  conditions: []
  actions:
  - action: telegram_bot.send_message
    data:
      config_entry_id: 01JZDD4YV6TJXXZ0BGJ3BDGD5A
      title: "\U0001F50B Nouvelle mesure de capacité batterie"
      message: 'Capacité mesurée : {{ state_attr(''sensor.calcul_capa_batteries_phase'',
        ''last_result_ah47'') }} Ah

        Mesure effectuée le : {{ state_attr(''sensor.calcul_capa_batteries_phase'',
        ''last_result_ts'') }}

        Notification envoyée le : {{ now().strftime(''%d/%m/%Y %H:%M:%S'') }}


        Valeur actuelle dans le SmartShunt : 214 Ah — à ajuster si écart significatif.'
  mode: single
