- id: '1777274484685'
  alias: Rapport Piscine Journalier IA V2
  description: ''
  triggers:
  - trigger: time
    at: '21:45:00'
  conditions: []
  actions:
  - variables:
      date_jour: '{{ now().strftime(''%d/%m/%Y %H:%M'') }}'
      temp_eau: '{{ states(''sensor.esp178_piscine_temperature_eau'') | float(0) }}'
      temp_eau_txt: "{% set v = states('sensor.esp178_piscine_temperature_eau') %}
        {% if v in ['unknown', 'unavailable', 'none', 'None', ''] %}\n  n/d\n{% else
        %}\n  {{ (v | float(0)) | round(1) }} °C\n{% endif %}"
      temp_ext_txt: "{% set v = states('sensor.vp2_temp_out') %} {% if v in ['unknown',
        'unavailable', 'none', 'None', ''] %}\n  n/d\n{% else %}\n  {{ (v | float(0))
        | round(1) }} °C\n{% endif %}"
      ph_mesure: '{{ states(''sensor.esp178_piscine_ph_ezo_filtre'') | float(0) }}'
      ph_cible: '{{ states(''number.esp178_piscine_ph_cible'') | float(7.2) }}'
      ph_txt: "{% set v = states('sensor.esp178_piscine_ph_ezo_filtre') %} {% if v
        in ['unknown', 'unavailable', 'none', 'None', ''] %}\n  n/d\n{% else %}\n
        \ {{ (v | float(0)) | round(2) }}\n{% endif %}"
      ph_cible_txt: '{{ ph_cible | round(2) }}'
      ecart_ph_txt: '{{ (ph_mesure - ph_cible) | round(2) }}'
      orp_mesure: '{{ states(''sensor.esp178_piscine_orp_ezo_filtre'') | float(0)
        }}'
      orp_cible: '{{ states(''number.esp178_piscine_consigne_orp'') | float(700) }}'
      orp_txt: "{% set v = states('sensor.esp178_piscine_orp_ezo_filtre') %} {% if
        v in ['unknown', 'unavailable', 'none', 'None', ''] %}\n  n/d\n{% else %}\n
        \ {{ (v | float(0)) | round(0) }} mV\n{% endif %}"
      orp_cible_txt: '{{ orp_cible | round(0) }}'
      ecart_orp_txt: '{{ (orp_mesure - orp_cible) | round(0) }}'
      chlore_libre_txt: "{% set v = states('sensor.my_sampling_point_pl_chlorine_free')
        %} {% if v in ['unknown', 'unavailable', 'none', 'None', ''] %}\n  n/d\n{%
        else %}\n  {{ (v | float(0)) | round(2) }} ppm\n{% endif %}"
      pression_filtre: '{{ states(''sensor.esp178_piscine_pression_filtre'') | float(0)
        }}'
      pression_filtre_txt: "{% set v = states('sensor.esp178_piscine_pression_filtre')
        %} {% if v in ['unknown', 'unavailable', 'none', 'None', ''] %}\n  n/d\n{%
        else %}\n  {{ (v | float(0)) | round(2) }} bar\n{% endif %}"
      mode_filtration_txt: '{{ states(''select.esp178_piscine_mode_fonctionnement_filtration'')
        }}'
      temps_filtration_txt: "{% set v = states('sensor.esp178_piscine_temps_ma_ppe_piscine_jour')
        %} {% if v in ['unknown', 'unavailable', 'none', 'None', ''] %}\n  n/d\n{%
        else %}\n  {{ v }}\n{% endif %}"
      energie_jour: '{{ states(''sensor.compteur_energie_piscine_jour_hp_hc'') | float(0)
        }}'
      energie_jour_txt: "{% set v = states('sensor.compteur_energie_piscine_jour_hp_hc')
        %} {% if v in ['unknown', 'unavailable', 'none', 'None', ''] %}\n  n/d\n{%
        else %}\n  {{ (v | float(0)) | round(2) }} kWh\n{% endif %}"
      conso_ph_jour_txt: "{% set v = states('sensor.esp178_piscine_conso_ph_jour')
        %} {% if v in ['unknown', 'unavailable', 'none', 'None', ''] %}\n  n/d\n{%
        else %}\n  {{ v }}\n{% endif %}"
      conso_chl_jour_txt: "{% set v = states('sensor.esp178_piscine_conso_chl_jour')
        %} {% if v in ['unknown', 'unavailable', 'none', 'None', ''] %}\n  n/d\n{%
        else %}\n  {{ v }}\n{% endif %}"
      poids_chlore_txt: "{% set v = states('sensor.esp129_pesage_chlore_poids_chlore')
        %} {% if v in ['unknown', 'unavailable', 'none', 'None', ''] %}\n  n/d\n{%
        else %}\n  {{ v }}\n{% endif %}"
      appoint_eau_jour_txt: "{% set v = states('sensor.esp173_cpt_eau_piscine') %}
        {% if v in ['unknown', 'unavailable', 'none', 'None', ''] %}\n  n/d\n{% else
        %}\n  {{ v }}\n{% endif %}"
      niveau_txt: "{% if is_state('binary_sensor.esp178_piscine_niv_defaut', 'on')
        %}\n  défaut niveau\n{% elif is_state('binary_sensor.esp178_piscine_niv_bas',
        'on') %}\n  niveau bas\n{% elif is_state('binary_sensor.esp178_piscine_niv_inter',
        'on') %}\n  niveau intermédiaire\n{% elif is_state('binary_sensor.esp178_piscine_niv_haut',
        'on') %}\n  niveau haut\n{% else %}\n  niveau inconnu\n{% endif %}"
      volet_txt: "{% if is_state('binary_sensor.esp178_piscine_volet_ferme', 'on')
        %}\n  fermé\n{% elif is_state('binary_sensor.esp178_piscine_volet_ouvert',
        'on') %}\n  ouvert\n{% else %}\n  intermédiaire / inconnu\n{% endif %}"
      statut_esp_txt: "{% if is_state('binary_sensor.esp178_piscine_status', 'on')
        %}\n  connecté\n{% else %}\n  hors ligne\n{% endif %}"
      pompe_filtre_txt: "{% if is_state('switch.esp178_piscine_cde_pompe_filtration',
        'on') %}\n  en marche\n{% else %}\n  arrêtée\n{% endif %}"
      mode_ph_txt: '{{ states(''select.esp178_piscine_mode_fonctionnement_regul_ph'')
        }}'
      mode_chlore_txt: '{{ states(''select.esp178_piscine_mode_fonct_regul_chlore'')
        }}'
      appoint_mode_txt: '{{ states(''select.esp178_piscine_mode_fonct_appoint_eau'')
        }}'
  - action: ai_task.generate_data
    response_variable: recap_piscine
    data:
      task_name: recap piscine journalier v2
      entity_id: ai_task.google_ai_task
      instructions: 'Tu es un assistant de suivi piscine.

        Rédige un message Telegram en français. Sois factuel, clair, compact et utile.
        N''invente aucune donnée. Si une donnée vaut "n/d", indique simplement qu''elle
        n''est pas disponible. 8 lignes maximum. Commence par un emoji.

        Objectif : faire un vrai bilan de fin de journée, pas une simple liste.

        Structure souhaitée : - 1 ligne de synthèse globale, - 1 à 2 lignes qualité
        d''eau, - 1 à 2 lignes filtration / fonctionnement, - 1 ligne produits / consommations,
        - 1 ligne état général / anomalies, - 1 courte recommandation si utile.

        Interprétation attendue : - comparer le pH à sa cible et dire s''il est bon,
        un peu haut ou un peu bas, - comparer l''ORP à sa consigne, - commenter le
        chlore libre si disponible, - signaler si la pression filtre paraît élevée
        ou à surveiller, - commenter brièvement le temps de filtration et l''énergie
        du jour, - signaler tout point d''attention sur appoint d''eau, niveau, volet
        ou état ESP, - si tout est correct, le dire simplement.

        Données : - Date : {{ date_jour }} - Température eau : {{ temp_eau_txt }}
        - Température extérieure : {{ temp_ext_txt }} - pH filtré : {{ ph_txt }} -
        pH cible : {{ ph_cible_txt }} - Ecart pH : {{ ecart_ph_txt }} - ORP filtré
        : {{ orp_txt }} - ORP cible : {{ orp_cible_txt }} mV - Ecart ORP : {{ ecart_orp_txt
        }} mV - Chlore libre : {{ chlore_libre_txt }} - Pression filtre : {{ pression_filtre_txt
        }} - Mode filtration : {{ mode_filtration_txt }} - Pompe filtration : {{ pompe_filtre_txt
        }} - Temps filtration du jour : {{ temps_filtration_txt }} - Energie piscine
        du jour : {{ energie_jour_txt }} - Mode régulation pH : {{ mode_ph_txt }}
        - Mode régulation chlore : {{ mode_chlore_txt }} - Consommation pH du jour
        : {{ conso_ph_jour_txt }} - Consommation chlore du jour : {{ conso_chl_jour_txt
        }} - Poids chlore restant : {{ poids_chlore_txt }} - Mode appoint eau : {{
        appoint_mode_txt }} - Appoint eau du jour : {{ appoint_eau_jour_txt }} - Etat
        niveau : {{ niveau_txt }} - Etat volet : {{ volet_txt }} - Etat ESP piscine
        : {{ statut_esp_txt }}'
      structure:
        titre:
          description: Titre court du message
          required: true
          selector:
            text:
        message:
          description: Message Telegram complet
          required: true
          selector:
            text:
        niveau:
          description: Niveau global parmi INFO, VIGILANCE ou ALERTE
          required: true
          selector:
            text:
  - choose:
    - conditions:
      - condition: template
        value_template: "{{\n  recap_piscine is defined\n  and recap_piscine.data
          is defined\n  and recap_piscine.data is mapping\n  and recap_piscine.data.message
          is defined\n  and (recap_piscine.data.message | string | trim | length)
          > 0\n}}"
      sequence:
      - action: telegram_bot.send_message
        data:
          config_entry_id: 01JZDD4YV6TJXXZ0BGJ3BDGD5A
          title: "{{\n  recap_piscine.data.titre\n  if recap_piscine.data.titre is
            defined\n  else 'Rapport Piscine'\n}}"
          message: '{{ recap_piscine.data.message }} {% if recap_piscine.data.niveau
            is defined %} {{ ''\n'' }}Niveau : {{ recap_piscine.data.niveau }} {%
            endif %}'
    default:
    - action: telegram_bot.send_message
      data:
        config_entry_id: 01JZDD4YV6TJXXZ0BGJ3BDGD5A
        title: Rapport Piscine
        message: '{{ date_jour }} {{ ''\n'' }}Eau / Ext : {{ temp_eau_txt }} / {{
          temp_ext_txt }} {{ ''\n'' }}pH : {{ ph_txt }} (cible {{ ph_cible_txt }},
          écart {{ ecart_ph_txt }}) {{ ''\n'' }}ORP : {{ orp_txt }} (cible {{ orp_cible_txt
          }} mV, écart {{ ecart_orp_txt }} mV) {{ ''\n'' }}Chlore libre : {{ chlore_libre_txt
          }} | Pression filtre : {{ pression_filtre_txt }} {{ ''\n'' }}Filtration
          : mode {{ mode_filtration_txt }}, pompe {{ pompe_filtre_txt }}, temps {{
          temps_filtration_txt }}, énergie {{ energie_jour_txt }} {{ ''\n'' }}Conso
          pH / chlore : {{ conso_ph_jour_txt }} / {{ conso_chl_jour_txt }} | Stock
          chlore : {{ poids_chlore_txt }} {{ ''\n'' }}Appoint eau : {{ appoint_eau_jour_txt
          }} | Niveau : {{ niveau_txt }} | Volet : {{ volet_txt }} {{ ''\n'' }}ESP
          piscine : {{ statut_esp_txt }}'
  mode: single
- id: '1780841913428'
  alias: Reboot Weewx 2026
  description: Redemarre d'abord le service WeeWX 2026 si la communication VP2, le
    service, le port USB Davis ou les archives restent en defaut. Reboot complet du
    Raspberry uniquement si le restart service ne suffit pas.
  triggers:
  - trigger: state
    id: perte_comm_mqtt
    entity_id: binary_sensor.status_communication_vantage_pro_2
    from: 'on'
    to: 'off'
    for:
      minutes: 5
  - trigger: state
    id: statut_weewx_down
    entity_id: sensor.meteo_weewx_statut
    from: up
    to: down
    for:
      minutes: 10
  - trigger: state
    id: service_weewx_off
    entity_id: binary_sensor.weewx2026_service_weewx
    from: 'on'
    to: 'off'
    for:
      minutes: 3
  - trigger: state
    id: usb_davis_absent
    entity_id: binary_sensor.weewx2026_port_davis_usb
    from: 'on'
    to: 'off'
    for:
      minutes: 2
  - trigger: numeric_state
    id: archive_en_retard
    entity_id: sensor.weewx2026_age_derniere_archive
    above: 15
    for:
      minutes: 5
  - trigger: state
    id: manuel
    entity_id: input_boolean.rebootweewx2026
    to: 'on'
  conditions:
  - condition: or
    conditions:
    - condition: trigger
      id: manuel
    - condition: template
      value_template: "{{ this.attributes.last_triggered is none\n   or (now() - this.attributes.last_triggered).total_seconds()
        > 1800 }}\n"
  actions:
  - action: telegram_bot.send_message
    continue_on_error: true
    data:
      config_entry_id: 01JZDD4YV6TJXXZ0BGJ3BDGD5A
      parse_mode: plain_text
      title: Etat RESEAU
      message: 'Defaut WeeWX 2026 detecte.

        Cause : {{ trigger.id }}

        Action : restart du service WeeWX demande.

        Communication VP2 MQTT : {{ states(''binary_sensor.status_communication_vantage_pro_2'')
        }}

        Statut WeeWX : {{ states(''sensor.meteo_weewx_statut'') }}

        Service WeeWX : {{ states(''binary_sensor.weewx2026_service_weewx'') }}

        Port Davis USB : {{ states(''binary_sensor.weewx2026_port_davis_usb'') }}

        Age derniere archive : {{ states(''sensor.weewx2026_age_derniere_archive'')
        }} min

        Uptime RPi : {{ states(''sensor.weewx2026_uptime'') }}

        Heure : {{ now().strftime(''%d/%m/%Y %H:%M:%S'') }}

        '
  - action: shell_command.restart_service_weewx2026
    continue_on_error: true
    data: {}
  - delay:
      seconds: 10
  - wait_template: "{{ is_state('binary_sensor.weewx2026_service_weewx', 'on')\n   and
      is_state('binary_sensor.weewx2026_port_davis_usb', 'on')\n   and is_state('binary_sensor.status_communication_vantage_pro_2',
      'on')\n   and (states('sensor.weewx2026_age_derniere_archive') | float(999))
      < 15 }}\n"
    timeout: 00:12:00
    continue_on_timeout: true
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ wait.completed }}'
      sequence:
      - action: telegram_bot.send_message
        continue_on_error: true
        data:
          config_entry_id: 01JZDD4YV6TJXXZ0BGJ3BDGD5A
          parse_mode: plain_text
          title: Etat RESEAU
          message: 'WeeWX 2026 recupere apres restart du service.

            Cause initiale : {{ trigger.id }}

            Communication VP2 MQTT : {{ states(''binary_sensor.status_communication_vantage_pro_2'')
            }}

            Statut WeeWX : {{ states(''sensor.meteo_weewx_statut'') }}

            Service WeeWX : {{ states(''binary_sensor.weewx2026_service_weewx'') }}

            Port Davis USB : {{ states(''binary_sensor.weewx2026_port_davis_usb'')
            }}

            Age derniere archive : {{ states(''sensor.weewx2026_age_derniere_archive'')
            }} min

            Heure : {{ now().strftime(''%d/%m/%Y %H:%M:%S'') }}

            '
    default:
    - action: telegram_bot.send_message
      continue_on_error: true
      data:
        config_entry_id: 01JZDD4YV6TJXXZ0BGJ3BDGD5A
        parse_mode: plain_text
        title: Etat RESEAU
        message: 'WeeWX 2026 toujours en defaut apres restart du service.

          Action : reboot complet du Raspberry demande.

          Cause initiale : {{ trigger.id }}

          Communication VP2 MQTT : {{ states(''binary_sensor.status_communication_vantage_pro_2'')
          }}

          Statut WeeWX : {{ states(''sensor.meteo_weewx_statut'') }}

          Service WeeWX : {{ states(''binary_sensor.weewx2026_service_weewx'') }}

          Port Davis USB : {{ states(''binary_sensor.weewx2026_port_davis_usb'') }}

          Age derniere archive : {{ states(''sensor.weewx2026_age_derniere_archive'')
          }} min

          Heure : {{ now().strftime(''%d/%m/%Y %H:%M:%S'') }}

          '
    - action: shell_command.reboot_rpi_weewx2026
      continue_on_error: true
      data: {}
    - delay:
        seconds: 2
    - action: telegram_bot.send_message
      continue_on_error: true
      data:
        config_entry_id: 01JZDD4YV6TJXXZ0BGJ3BDGD5A
        parse_mode: plain_text
        title: Etat RESEAU
        message: 'Commande reboot Raspberry WeeWX 2026 envoyee.

          Cause initiale : {{ trigger.id }}

          Heure : {{ now().strftime(''%d/%m/%Y %H:%M:%S'') }}

          '
  - action: input_boolean.turn_off
    continue_on_error: true
    target:
      entity_id: input_boolean.rebootweewx2026
    data: {}
  mode: single
- id: '1787411767535'
  alias: Rapport 22:00 DESS IA
  description: ''
  triggers:
  - trigger: time
    at: '22:00:00'
    id: '22:00'
  conditions: []
  actions:
  - variables:
      date_snapshot: '{{ states(''sensor.date_time'') }}'
      previ_prod_demain: '{{ states(''sensor.victron_remote_monitoring_production_d_energie_estimee_demain'')
        | float(0) | round(1) }}'
      soc_cible: '{{ states(''sensor.mp2_dess_cible_soc_par_mqtt'') | float(0) | round(0)
        }}'
      soc_actuel: '{{ states(''sensor.victron_mqtt_c0619ab1db0d_system_0_system_dc_battery_soc'')
        | float(0) | round(1) }}'
      forcage_actif_num: '{{ 1 if is_state(''input_boolean.forcage_charge_pgm_mp1_100'',
        ''on'') else 0 }}'
      forcage_actif_txt: '{{ ''actif'' if is_state(''input_boolean.forcage_charge_pgm_mp1_100'',
        ''on'') else ''inactif'' }}'
      niveau_forcage_num: '{{ states(''input_number.mp2_niveau_forcage_cp1'') | float(0)
        | round(0) }}'
      niveau_forcage: '{{ niveau_forcage_num if forcage_actif_num == 1 else ''n/d''
        }}'
      ecart_soc_cible_txt: '{{ ''%+.1f'' | format((soc_actuel | float - soc_cible
        | float) | round(1)) }} %'
      ecart_soc_forcage_txt: "{% if forcage_actif_num == 1 %}\n  {{ '%+.1f' | format((soc_actuel
        | float - niveau_forcage_num | float) | round(1)) }} %\n{% else %}\n  n/d\n{%
        endif %}"
      perte_nuit_estimee_pct: 27
      soc_prevu_0545_sans_charge: '{{ [soc_actuel | float - perte_nuit_estimee_pct,
        0] | max | round(1) }}'
      besoin_corrige_pct_txt: '{{ [soc_cible | float - soc_prevu_0545_sans_charge
        | float, 0] | max | round(1) }}'
      cap_ah_mesure: '{{ states(''sensor.capacite_batterie_estimee_par_nr'') | float(300)
        | round(0) }}'
      i_avg_estime: 40
      duree_charge_min: "{% set need_pct = besoin_corrige_pct_txt | float(0) %}\n{%
        if need_pct <= 0 %}\n  0\n{% else %}\n  {% set ah_needed = (need_pct / 100)
        * (cap_ah_mesure | float) %}\n  {% set bulk_min = (ah_needed / i_avg_estime)
        * 60 if i_avg_estime > 0 else 0 %}\n  {% set abs_min = 60 if (soc_cible |
        float) >= 95 else 0 %}\n  {% set ns = namespace(need=(bulk_min + abs_min)
        | round(0, 'ceil')) %}\n  {% if ns.need < 15 %}{% set ns.need = 15 %}{% endif
        %}\n  {% if ns.need > 480 %}{% set ns.need = 480 %}{% endif %}\n  {{ ns.need
        | int }}\n{% endif %}"
      duree_charge_previ_min_txt: '{{ duree_charge_min | int }}'
      heure_fin_charge_txt: 05:45
      heure_debut_charge_previ_txt: "{% if (duree_charge_min | int) == 0 %}\n  n/d\n{%
        else %}\n  {% set step = 5 %}\n  {% set start_floor = 22 * 60 %}\n  {% set
        end_fixed = 5 * 60 + 45 %}\n  {% set ns = namespace(start=(((end_fixed - (duree_charge_min
        | int)) // step) * step) | int) %}\n  {% if ns.start < 0 %}{% set ns.start
        = ns.start + 1440 %}{% endif %}\n  {% if not (ns.start >= start_floor or ns.start
        < end_fixed) %}\n    {% set ns.start = start_floor %}\n  {% endif %}\n  {{
        '%02d:%02d' | format((ns.start // 60) | int, (ns.start % 60) | int) }}\n{%
        endif %}"
      synthese_charge_previ_txt: "{% if (duree_charge_min | int) == 0 %}\n  pas de
        charge prévisionnelle nécessaire\n{% else %}\n  début estimé {{ heure_debut_charge_previ_txt
        }}, fin {{ heure_fin_charge_txt }}, durée ~{{ duree_charge_min | int }} min\n{%
        endif %}"
  - action: ai_task.generate_data
    continue_on_error: true
    response_variable: rapport_dess_ia
    data:
      task_name: rapport dess 22h
      entity_id: ai_task.google_ai_task
      instructions: 'Tu es un assistant énergie domestique.

        Rédige un message Telegram en français. Sois factuel, compact et utile. N''invente
        aucune donnée. 6 lignes maximum. Commence par un emoji.

        Analyse uniquement la situation DESS à 22:00.

        Tu dois : - indiquer si le forçage DESS est actif ou non, - si le forçage
        est actif, mentionner le niveau de forçage demandé, - comparer le SOC actuel
        au SOC cible, - si le forçage est actif, comparer aussi le SOC actuel au niveau
        de forçage, - rappeler la prévision de production demain, - estimer le SOC
        à 05:45 sans charge en tenant compte d''une baisse nocturne historique, -
        indiquer l''heure prévisionnelle de début de charge pour finir à 05:45, -
        préciser que cette estimation repose sur une baisse nocturne moyenne de 27
        %, - conclure par une remarque très courte sur la cohérence de la situation.

        Données : - Horodatage : {{ date_snapshot }} - Prévision production demain
        : {{ previ_prod_demain }} kWh - Forçage DESS : {{ forcage_actif_txt }} - Forçage
        DESS (0/1) : {{ forcage_actif_num }} - Niveau de forçage demandé : {{ niveau_forcage
        }} - SOC cible : {{ soc_cible }} % - SOC actuel : {{ soc_actuel }} % - Ecart
        SOC actuel - SOC cible : {{ ecart_soc_cible_txt }} - Ecart SOC actuel - niveau
        de forçage : {{ ecart_soc_forcage_txt }} - Baisse nocturne historique estimée
        22:00->05:45 : {{ perte_nuit_estimee_pct }} % - SOC prévu à 05:45 sans charge
        : {{ soc_prevu_0545_sans_charge }} % - Besoin corrigé de charge : {{ besoin_corrige_pct_txt
        }} % - Heure prévisionnelle de début de charge : {{ heure_debut_charge_previ_txt
        }} - Heure prévisionnelle de fin de charge : {{ heure_fin_charge_txt }} -
        Durée prévisionnelle de charge : {{ duree_charge_previ_min_txt }} min - Synthèse
        prévisionnelle : {{ synthese_charge_previ_txt }} - Capacité batterie utilisée
        pour le calcul : {{ cap_ah_mesure }} Ah'
  - choose:
    - conditions:
      - condition: template
        value_template: "{{\n  rapport_dess_ia is defined and\n  rapport_dess_ia.data
          is defined and\n  (rapport_dess_ia.data | string | trim | length) > 0\n}}"
      sequence:
      - action: telegram_bot.send_message
        metadata: {}
        data:
          config_entry_id: 01JZDD4YV6TJXXZ0BGJ3BDGD5A
          title: Rapport DESS 22h
          message: '{{ rapport_dess_ia.data }}'
    default:
    - action: telegram_bot.send_message
      metadata: {}
      data:
        config_entry_id: 01JZDD4YV6TJXXZ0BGJ3BDGD5A
        title: Rapport DESS 22h
        message: "    {{ date_snapshot }}{{-\"\\n\"-}}\n    Prévi demain = {{ previ_prod_demain
