            solaire : {{ taux_autonomie_solaire }} % / {{ taux_autoconsommation_solaire
            }} %\nBatterie min/max/soir : {{ bat_min_txt }} / {{ bat_max_txt }} /
            {{ soc_soir_txt }}\n\nProd prévue/réalisée : {{ previ_prod_jour }} / {{
            realise_prod_jour }} kWh (écart {{ ecart_prod_pct_txt }})\n{{ recap_energie.data.analyse_production
            }}\n\nConso 6-22h prévue/réalisée : {{ previ_conso_6_22 }} / {{ realise_conso_6_22
            }} kWh (écart {{ ecart_conso_6_22_pct_txt }})\n{{ recap_energie.data.analyse_consommation
            }}\n\nTempo demain : {{ couleur_demain }} — {{ recap_energie.data.conseil_demain
            }}\n\nNiveau : {{ recap_energie.data.niveau if recap_energie.data.niveau
            is defined else 'INFO' }}"
    default:
    - action: telegram_bot.send_message
      data:
        config_entry_id: 01JZDD4YV6TJXXZ0BGJ3BDGD5A
        title: Recap Journalier Energie
        message: '{{ date_jour }} {{ ''\n'' }}Conso réseau Tempo : {{ conso_reseau_tempo
          }} kWh {{ ''\n'' }}Conso foyer estimée : {{ conso_foyer_estimee }} kWh {{
          ''\n'' }}HC / HP : {{ total_hc }} / {{ total_hp }} kWh {{ ''\n'' }}Poste
          dominant : {{ poste_dominant }} {{ ''\n'' }}Coût : {{ cout_jour_txt }} {{
          ''\n'' }}PV : {{ pv_jour_txt }} {{ ''\n'' }}Import / Export : {{ import_reseau_txt
          }} / {{ export_reseau_txt }} {{ ''\n'' }}Autonomie / Autoconso : {{ taux_autonomie_solaire
          }} % / {{ taux_autoconsommation_solaire }} % {{ ''\n'' }}Export PV / Part
          import : {{ taux_export_pv }} % / {{ part_import_reseau }} % {{ ''\n'' }}Batterie
          min / max / soir : {{ bat_min_txt }} / {{ bat_max_txt }} / {{ soc_soir_txt
          }} {{ ''\n'' }}Prod prévue / réalisée : {{ previ_prod_jour }} / {{ realise_prod_jour
          }} kWh (écart {{ ecart_prod_jour_txt }}, {{ ecart_prod_pct_txt }}) {{ ''\n''
          }}Conso 6-22 prévue / réalisée : {{ previ_conso_6_22 }} / {{ realise_conso_6_22
          }} kWh (écart {{ ecart_conso_6_22_txt }}, {{ ecart_conso_6_22_pct_txt }})
          {{ ''\n'' }}Tempo demain : {{ couleur_demain }}'
  - if:
    - condition: template
      value_template: '{{ trigger is defined and trigger.id == ''horaire_2359'' }}'
    then:
    - action: notify.send_message
      target:
        entity_id: notify.suivi_prod
      data:
        message: "{{\n  [\n    now().strftime('%Y-%m-%d %H:%M:%S'),\n    conso_reseau_tempo,\n
