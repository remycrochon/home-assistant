- id: '1642614758763'
  alias: Changement HP<->HC
  description: 1/3/5=HC_2/4/6=HP
  triggers:
  - entity_id:
    - sensor.esp124_tic_linky_tarif_distributeur
    trigger: state
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: or
        conditions:
        - condition: state
          entity_id: sensor.esp124_tic_linky_n_tarif
          state: '1.0'
        - condition: state
          entity_id: sensor.esp124_tic_linky_n_tarif
          state: '3.0'
        - condition: state
          entity_id: sensor.esp124_tic_linky_n_tarif
          state: '5.0'
      sequence:
      - data:
          option: hc
        target:
          entity_id:
          - select.compteur_energie_pac
          - select.compteur_energie_autres_jour
          - select.compteur_energie_onduleur_jour
          - select.compteur_energie_vmc_jour
          - select.compteur_energie_sdb_jour
          - select.compteur_energie_wc_jour
          - select.compteur_energie_cuisine_jour
          - select.compteur_energie_mal_jour
          - sensor.compteur_energie_piscine_jour_hp_hc
        action: select.select_option
    - conditions:
      - condition: or
        conditions:
        - condition: state
          entity_id: sensor.esp124_tic_linky_n_tarif
          state: '2.0'
        - condition: state
          entity_id: sensor.esp124_tic_linky_n_tarif
          state: '4.0'
        - condition: state
          entity_id: sensor.esp124_tic_linky_n_tarif
          state: '6.0'
      sequence:
      - data:
          option: hp
        target:
          entity_id:
          - select.compteur_energie_pac
          - select.compteur_energie_autres_jour
          - select.compteur_energie_onduleur_jour
          - select.compteur_energie_vmc_jour
          - select.compteur_energie_sdb_jour
          - select.compteur_energie_wc_jour
          - select.compteur_energie_cuisine_jour
          - select.compteur_energie_mal_jour
          - sensor.compteur_energie_piscine_jour_hp_hc
        action: select.select_option
    default: []
  mode: single
