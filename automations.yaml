      ecart_soc_cible_txt: '{{ ''%+.1f'' | format((soc_actuel | float - soc_cible
        | float) | round(1)) }} %'
      ecart_soc_forcage_txt: "{% if forcage_actif_num == 1 %}\n  {{ '%+.1f' | format((soc_actuel
        | float - niveau_forcage_num | float) | round(1)) }} %\n{% else %}\n  n/d\n{%
        endif %}"
      perte_nuit_estimee_pct: 28
      soc_prevu_0545_sans_charge: '{{ [soc_actuel | float - perte_nuit_estimee_pct,
        0] | max | round(1) }}'
      besoin_corrige_pct_txt: '{{ [soc_cible | float - soc_prevu_0545_sans_charge
        | float, 0] | max | round(1) }}'
      cap_ah_mesure: '{{ states(''sensor.capacite_batterie_estimee_par_nr'') | float(300)
        | round(0) }}'
      i_avg_estime: 40
      duree_charge_min: "{% set need_pct = besoin_corrige_pct_txt | float(0) %}\n{%
        if need_pct <= 0 %}\n  0\n{% else %}\n  {% set ah_needed = (need_pct / 100)
        * (cap_ah_mesure | float) %}\n  {% set bulk_min = (ah_needed / i_avg_estime)
        * 60 if i_avg_estime > 0 else 0 %}\n  {% set abs_min = 60 if (soc_cible |
        float) >= 95 else 0 %}\n  {% set ns = namespace(need=(bulk_min + abs_min)
        | round(0, 'ceil')) %}\n  {% if ns.need < 15 %}{% set ns.need = 15 %}{% endif
        %}\n  {% if ns.need > 480 %}{% set ns.need = 480 %}{% endif %}\n  {{ ns.need
        | int }}\n{% endif %}"
      duree_charge_previ_min_txt: '{{ duree_charge_min | int }}'
      heure_fin_charge_txt: 05:45
      heure_debut_charge_previ_txt: "{% if (duree_charge_min | int) == 0 %}\n  n/d\n{%
        else %}\n  {% set step = 5 %}\n  {% set start_floor = 22 * 60 %}\n  {% set
        end_fixed = 5 * 60 + 45 %}\n  {% set ns = namespace(start=(((end_fixed - (duree_charge_min
        | int)) // step) * step) | int) %}\n  {% if ns.start < 0 %}{% set ns.start
        = ns.start + 1440 %}{% endif %}\n  {% if not (ns.start >= start_floor or ns.start
        < end_fixed) %}\n    {% set ns.start = start_floor %}\n  {% endif %}\n  {{
        '%02d:%02d' | format((ns.start // 60) | int, (ns.start % 60) | int) }}\n{%
        endif %}"
      synthese_charge_previ_txt: "{% if (duree_charge_min | int) == 0 %}\n  pas de
        charge prévisionnelle nécessaire\n{% else %}\n  début estimé {{ heure_debut_charge_previ_txt
        }}, fin {{ heure_fin_charge_txt }}, durée ~{{ duree_charge_min | int }} min\n{%
        endif %}"
      linky_kwh_22h: '{{ states(''sensor.linky_hphc_kwh'') | float(0) | round(2) }}'
  - action: ai_task.generate_data
    continue_on_error: true
    response_variable: rapport_dess_ia
    data:
      task_name: rapport dess 22h
      entity_id: ai_task.google_ai_task
      instructions: 'Tu es un assistant énergie domestique. Tu ne dois JAMAIS produire
        de chiffres, pourcentages, unités ou horaires (%, kWh, Ah, min, hh:mm) : toutes
        les valeurs numériques sont déjà connues et affichées séparément par le système.
        Ton seul travail est de juger si la situation DESS de ce soir est cohérente
        ou mérite une vigilance, et de le dire en une phrase très courte (maximum
        15 mots), sans jamais réutiliser ou paraphraser un nombre fourni ci-dessous.

        Contexte du jour (pour information seulement, ne recopie aucune valeur) :
        - Forçage DESS : {{ forcage_actif_txt }} - Niveau de forçage demandé : {{
        niveau_forcage }} - SOC cible : {{ soc_cible }} %, SOC actuel : {{ soc_actuel
        }} % - Ecart SOC actuel / SOC cible : {{ ecart_soc_cible_txt }} - Ecart SOC
        actuel / niveau de forçage : {{ ecart_soc_forcage_txt }} - Prévision production
        demain : {{ previ_prod_demain }} kWh - SOC prévu à 05:45 sans charge : {{
        soc_prevu_0545_sans_charge }} % - Synthèse charge prévisionnelle : {{ synthese_charge_previ_txt
        }}

        Exemples de style attendu pour la remarque (ne pas recopier tel quel) : "Situation
        cohérente, aucune vigilance particulière ce soir." ou "Écart notable au SOC
        cible, à surveiller demain matin." ou "Forçage actif mais production de demain
        incertaine, à reconfirmer."'
      structure:
        titre:
          description: Titre très court du message Telegram, sans aucun chiffre
          required: true
          selector:
            text:
        commentaire_coherence:
          description: Une phrase courte jugeant si la situation DESS du soir est
            cohérente ou mérite une vigilance, sans aucun chiffre ni unité
          required: true
          selector:
            text:
        niveau:
          description: Niveau global parmi INFO, VIGILANCE ou ALERTE
          required: true
          selector:
            text:
  - choose:
    - conditions:
      - condition: template
        value_template: "{{\n  rapport_dess_ia is defined and\n  rapport_dess_ia.data
          is defined and\n  rapport_dess_ia.data.titre is defined and\n  rapport_dess_ia.data.commentaire_coherence
          is defined\n}}"
      sequence:
      - action: telegram_bot.send_message
        metadata: {}
        data:
          config_entry_id: 01JZDD4YV6TJXXZ0BGJ3BDGD5A
          title: '{{ rapport_dess_ia.data.titre }}'
          message: "    {{ date_snapshot }}{{-\"\\n\"-}}\n    Prévi demain = {{ previ_prod_demain
            }} kWh{{-\"\\n\"-}}\n    Forçage DESS = {{ forcage_actif_txt }}{% if forcage_actif_num
            == 1 %} / Niveau = {{ niveau_forcage }} %{% endif %}{{-\"\\n\"-}}\n    SOC
            cible = {{ soc_cible }} % / Actuel = {{ soc_actuel }} %{{-\"\\n\"-}}\n
            \   Ecart SOC-cible = {{ ecart_soc_cible_txt }}{% if forcage_actif_num
            == 1 %} / Ecart SOC-forçage = {{ ecart_soc_forcage_txt }}{% endif %}{{-\"\\n\"-}}\n
            \   SOC prévu à 05:45 sans charge = {{ soc_prevu_0545_sans_charge }} %{{-\"\\n\"-}}\n
            \   Charge prévisionnelle = {{ synthese_charge_previ_txt }}{{-\"\\n\"-}}\n
            \   {{ rapport_dess_ia.data.commentaire_coherence }}{{-\"\\n\"-}}\n    Niveau
            = {{ rapport_dess_ia.data.niveau if rapport_dess_ia.data.niveau is defined
            else 'INFO' }}\n"
    default:
    - action: telegram_bot.send_message
      metadata: {}
      data:
        config_entry_id: 01JZDD4YV6TJXXZ0BGJ3BDGD5A
        title: Rapport DESS 22h
        message: "    {{ date_snapshot }}{{-\"\\n\"-}}\n    Prévi demain = {{ previ_prod_demain
          }} kWh{{-\"\\n\"-}}\n    Forçage DESS = {{ forcage_actif_txt }}{% if forcage_actif_num
          == 1 %} / Niveau = {{ niveau_forcage }} %{% endif %}{{-\"\\n\"-}}\n    SOC
          cible = {{ soc_cible }} % / Actuel = {{ soc_actuel }} %{{-\"\\n\"-}}\n    Ecart
          SOC-cible = {{ ecart_soc_cible_txt }}{% if forcage_actif_num == 1 %} / Ecart
          SOC-forçage = {{ ecart_soc_forcage_txt }}{% endif %}{{-\"\\n\"-}}\n    SOC
          prévu à 05:45 sans charge = {{ soc_prevu_0545_sans_charge }} %{{-\"\\n\"-}}\n
          \   Charge prévisionnelle = {{ synthese_charge_previ_txt }}\n"
  - action: notify.send_message
    target:
      entity_id: notify.suivi_dess
    data:
      message: '{{ now().strftime(''%Y-%m-%d %H:%M:%S'') }}, {{ previ_prod_demain
