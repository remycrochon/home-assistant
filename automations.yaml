          \   conso_foyer_estimee,\n    solaire_autoconsomme,\n    taux_autonomie_solaire,\n
          \   taux_autoconsommation_solaire,\n    taux_export_pv,\n    part_import_reseau,\n
          \   bat_min_num,\n    bat_max_num,\n    soc_soir_num,\n    previ_prod_jour,\n
          \   realise_prod_jour,\n    ecart_prod_jour,\n    ecart_prod_pct_num,\n
          \   previ_conso_6_22,\n    realise_conso_6_22,\n    ecart_conso_6_22,\n
          \   ecart_conso_6_22_pct_num,\n    couleur_demain\n  ] | join(', ')\n}}"
