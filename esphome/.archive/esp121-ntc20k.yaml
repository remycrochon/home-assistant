# ESP32 S3 mini - Lecture NTC 20k
substitutions:
  name_e1: "esp121-ntc20k"
  friendly_name: "esp121 ntc20k"
  adress_ip: 192.168.0.121

esphome:
  name: ${name_e1}
  friendly_name: ${friendly_name}
  on_boot:
    priority: 600
    then:
      - switch.turn_off: alim_ntc

esp32:
  board: esp32-s3-devkitc-1
  flash_size: 4MB
  cpu_frequency: 160MHZ
  framework:
    type: esp-idf

logger:
  level: DEBUG

api:

ota:
  - platform: esphome

web_server:
  port: 80
  version: 1

wifi:
  networks:
    - ssid: !secret wifi
      password: !secret mdpwifi

  reboot_timeout: 1min

  manual_ip:
    static_ip: ${adress_ip}
    gateway: 192.168.0.254
    subnet: 255.255.255.0

  fast_connect: true
  output_power: 17dB
  power_save_mode: none

binary_sensor:
  - platform: status
    name: "Status"

switch:
  - platform: restart
    name: "Restart"

  # Alimentation du pont diviseur NTC uniquement pendant la mesure
  - platform: gpio
    id: alim_ntc
    name: "Alimentation NTC"
    pin: GPIO5
    restore_mode: ALWAYS_OFF
    entity_category: "diagnostic"

sensor:
  # Signal WiFi
  - platform: wifi_signal
    name: "WiFi Signal dB"
    id: wifi_signal_db
    update_interval: 60s
    entity_category: "diagnostic"

  - platform: copy
    source_id: wifi_signal_db
    name: "WiFi Signal Percent"
    filters:
      - lambda: return min(max(2 * (x + 100.0), 0.0), 100.0);
    unit_of_measurement: "%"
    entity_category: "diagnostic"
    device_class: ""

  # Lecture ADC du pont NTC
  - platform: adc
    id: adc_ntc
    name: "ADC NTC"
    pin: GPIO4
    attenuation: 12db
    update_interval: never
    accuracy_decimals: 3
    entity_category: "diagnostic"

  # Conversion tension ADC -> résistance NTC
  - platform: resistance
    id: resistance_ntc
    name: "Resistance NTC"
    sensor: adc_ntc
    configuration: DOWNSTREAM
    resistor: 20kOhm
    reference_voltage: 3.3V
    accuracy_decimals: 0
    entity_category: "diagnostic"

  # Conversion résistance -> température
  - platform: ntc
    id: temperature_ntc
    name: "Temperature NTC 20k"
    sensor: resistance_ntc
    calibration:
      b_constant: 3950
      reference_temperature: 25°C
      reference_resistance: 20kOhm
    accuracy_decimals: 1

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "Adresse IP"
    ssid:
      name: "Wifi connecté"
    mac_address:
      name: "Adresse Mac"

interval:
  # Lecture toutes les 10 s pour calibration
  - interval: 10s
    then:
      - switch.turn_on: alim_ntc
      - delay: 300ms
      - component.update: adc_ntc
      - delay: 100ms
      - switch.turn_off: alim_ntc