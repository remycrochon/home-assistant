substitutions:
  device_name: esp125-frigo
  adress_ip: "192.168.0.125"

esphome:
  name: ${device_name}
  on_boot:
    priority: -100
    then:
      - climate.control:
          id: pid_climate
          mode: "OFF"
      - lambda: |-
          id(r1_demoulage_arme) = false;
          id(r1_cycle_chauffe_en_cours) = false;
          id(r1_minutes_sans_demoulage) = 0;
          id(r1_etat).publish_state("Repos");
      # Re-applique le mode memorise (Auto / Manu / Arret) apres un redemarrage
      - script.execute:
          id: appliquer_mode
          mode: !lambda 'return std::string(id(mode_fonctionnement).current_option());'

esp32:
  board: esp32dev
  framework:
    type: esp-idf
    advanced:
      minimum_chip_revision: "3.0"


logger:

api:

ota:
  - platform: esphome

wifi:
  networks:
    - ssid: !secret wifi_esp
      password: !secret mdpwifi_esp
  reboot_timeout: 5min
  min_auth_mode: WPA2
  manual_ip:
    static_ip: ${adress_ip}
    gateway: 192.168.0.254
    subnet: 255.255.255.0
    dns1: !secret dns1
    dns2: !secret dns2

web_server:
  port: 80
  version: 3

one_wire:
  - platform: gpio
    pin: GPIO4
    id: ow1

globals:
  - id: r1_demoulage_arme
    type: bool
    restore_value: no
    initial_value: "false"

  - id: r1_cycle_chauffe_en_cours
    type: bool
    restore_value: no
    initial_value: "false"

  - id: r1_minutes_sans_demoulage
    type: int
    restore_value: no
    initial_value: "0"

  - id: r1_chauffe_start_ms
    type: uint32_t
    restore_value: no
    initial_value: "0"

  # Compteur persistant du nombre de cycles de demoulage effectivement executes
  # (survit aux redemarrages/coupures).
  - id: r1_compteur_demoulage
    type: int
    restore_value: yes
    initial_value: "0"

  # Compteur persistant du nombre de cycles d'entretien sans demoulage effectivement executes
  # (survit aux redemarrages/coupures).
  - id: r1_compteur_entretien
    type: int
    restore_value: yes
    initial_value: "0"

binary_sensor:
  - platform: status
    name: "Status"

  - platform: template
    name: "R1 Demoulage Arme"
    id: r1_demoulage_arme_sensor
    lambda: |-
      return id(r1_demoulage_arme);

  - platform: template
    name: "R1 Chauffe En Cours"
    id: r1_chauffe_en_cours_sensor
    lambda: |-
      return id(r1_cycle_chauffe_en_cours);

# Mode de fonctionnement memorise (restore_value) :
#  - Auto  : production de glacons active, cycles demoulage / entretien automatiques
#  - Manu  : production de glacons arretee, regulation PID de chauffe R1 forcee, ventilo force a l'arret
#  - Arret : tout est arrete (regulation, chauffage, ventilo)
select:
  - platform: template
    name: "Mode de fonctionnement"
    id: mode_fonctionnement
    icon: "mdi:state-machine"
    options:
      - "Auto"
      - "Manu"
      - "Arrêt"
    initial_option: "Auto"
    restore_value: true
    optimistic: true
    set_action:
      - script.execute:
          id: appliquer_mode
          mode: !lambda 'return x;'

number:
  - platform: template
    name: "R1 Seuil froid armement"
    id: r1_seuil_froid_armement
    min_value: -25
    max_value: 0
    step: 0.5
    mode: box
    restore_value: true
    optimistic: true
    initial_value: -8
    unit_of_measurement: "°C"

  - platform: template
    name: "R1 Seuil detection demoulage"
    id: r1_seuil_detection_demoulage
    min_value: -5
    max_value: 20
    step: 0.5
    mode: box
    restore_value: true
    optimistic: true
    initial_value: 2
    unit_of_measurement: "°C"

  - platform: template
    name: "R1 Consigne PID demoulage"
    id: r1_consigne_pid_demoulage
    min_value: 0
    max_value: 15
    step: 0.5
    mode: box
    restore_value: true
    optimistic: true
    initial_value: 6
    unit_of_measurement: "°C"

  # Parametre unique, partage par les deux cycles (demoulage et entretien) :
  # duree de chauffe garantie avant toute verification des conditions de sortie
  # (seuil froid pour le demoulage, securite bac pour l'entretien).
  - platform: template
    name: "R1 Duree minimale chauffe"
    id: r1_duree_min_chauffe
    min_value: 0.5
    max_value: 15
    step: 0.5
    mode: box
    restore_value: true
    optimistic: true
    initial_value: 5
    unit_of_measurement: "min"

  - platform: template
    name: "R1 Consigne PID entretien"
    id: r1_consigne_pid_entretien
    min_value: 0
    max_value: 15
    step: 0.5
    mode: box
    restore_value: true
    optimistic: true
    initial_value: 10
    unit_of_measurement: "°C"

  # Consigne de la regulation PID forcee en mode Manu.
  - platform: template
    name: "R1 Consigne PID manuel"
    id: r1_consigne_pid_manuel
    min_value: 0
    max_value: 15
    step: 0.5
    mode: box
    restore_value: true
    optimistic: true
    initial_value: 6
    unit_of_measurement: "°C"
    set_action:
      - if:
          condition:
            lambda: |-
              return id(mode_fonctionnement).current_option() == "Manu";
          then:
            - climate.control:
                id: pid_climate
                mode: HEAT
                target_temperature: !lambda 'return x;'

  - platform: template
    name: "R1 Duree maxi PID entretien"
    id: r1_duree_maxi_pid_entretien
    min_value: 5
    max_value: 60
    step: 1
    mode: box
    restore_value: true
    optimistic: true
    initial_value: 40
    unit_of_measurement: "min"

  - platform: template
    name: "R1 Seuil securite bac entretien"
    id: r1_seuil_securite_bac_entretien
    min_value: -10
    max_value: 5
    step: 0.5
    mode: box
    restore_value: true
    optimistic: true
    initial_value: -1
    unit_of_measurement: "°C"

  - platform: template
    name: "R1 Delai entretien sans demoulage"
    id: r1_delai_entretien_h
    min_value: 1
    max_value: 24
    step: 1
    mode: box
    restore_value: true
    optimistic: true
    initial_value: 2
    unit_of_measurement: "h"

  - platform: template
    name: "R1 Temperature securite max"
    id: r1_temperature_securite_max
    min_value: 5
    max_value: 30
    step: 0.5
    mode: box
    restore_value: true
    optimistic: true
    initial_value: 15
    unit_of_measurement: "°C"

  - platform: template
    name: "R1 Duree maxi PID demoulage"
    id: r1_duree_maxi_pid_demoulage
    min_value: 3
    max_value: 30
    step: 1
    mode: box
    restore_value: true
    optimistic: true
    initial_value: 6
    unit_of_measurement: "min"

sensor:
  - platform: dallas_temp
    one_wire_id: ow1
    name: "Temp DS18B20 Resistance"
    address: 0xf300eca700000328
    id: temp_ds18b20_r
    device_class: temperature
    state_class: "measurement"
    update_interval: 5s
    accuracy_decimals: 1
    filters:
      - lambda: |-
          if (isnan(x)) return {};
          return x;

  # Sonde dégivrage : valeur BRUTE, utilisée par la logique et le debug.
  # Interne : elle n'est pas envoyée à HA (c'est la copie ci-dessous qui l'est).
  - platform: dallas_temp
    one_wire_id: ow1
    name: "Temp DS18B20 Degivrage Brut"
    address: 0x9900000491efe528
    id: temp_ds18b20_d
    internal: true
    device_class: temperature
    state_class: "measurement"
    update_interval: 5s
    accuracy_decimals: 1
    filters:
      - lambda: |-
          if (isnan(x)) return {};
          return x;

  # Copie filtrée pour HA : même nom qu'avant => même entité, même historique.
  # Une valeur au plus toutes les 60 s, sauf variation >= 0,5 °C (envoyée tout de suite,
  # donc les cycles de dégivrage restent bien visibles).
  - platform: copy
    source_id: temp_ds18b20_d
    name: "Temp DS18B20 Degivrage"
    id: temp_ds18b20_d_ha
    device_class: temperature
    state_class: "measurement"
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    filters:
      - or:
          - throttle: 60s
          - delta: 0.5

  # Température bac lue depuis l'ESP179 via Home Assistant.
  # Elle sert uniquement à sécuriser / prolonger l'entretien R1.
  - platform: homeassistant
    name: "Temp Bac Frigo ESP179"
    id: temp_bac_frigo_esp179
    entity_id: sensor.cuisine_esp179_test_ventilo_frigo_temp_ds18b20_bac_frigo_test
    internal: true

  - platform: template
    name: "R1 Minutes sans demoulage"
    id: r1_minutes_sans_demoulage_sensor
    unit_of_measurement: "min"
    accuracy_decimals: 0
    update_interval: 60s
    lambda: |-
      return id(r1_minutes_sans_demoulage);

  # Nombre total de cycles de demoulage executes depuis le dernier reset
  # (persiste aux redemarrages).
  - platform: template
    name: "R1 Compteur Demoulage"
    id: r1_compteur_demoulage_sensor
    icon: "mdi:counter"
    accuracy_decimals: 0
    state_class: "total_increasing"
    update_interval: 60s
    lambda: |-
      return id(r1_compteur_demoulage);

  # Nombre total de cycles d'entretien (sans demoulage) executes depuis le dernier reset
  # (persiste aux redemarrages).
  - platform: template
    name: "R1 Compteur Entretien"
    id: r1_compteur_entretien_sensor
    icon: "mdi:counter"
    accuracy_decimals: 0
    state_class: "total_increasing"
    update_interval: 60s
    lambda: |-
      return id(r1_compteur_entretien);

  - platform: pid
    name: "PID Sortie"
    type: HEAT

  - platform: pid
    name: "PID P"
    type: PROPORTIONAL

  - platform: pid
    name: "PID I"
    type: INTEGRAL

  - platform: pid
    name: "PID D"
    type: DERIVATIVE

  - platform: pid
    name: "PID Erreur"
    type: ERROR

  - platform: template
    name: "R1 Consigne PID Active"
    id: r1_consigne_pid_active
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    update_interval: 5s
    lambda: |-
      if (id(r1_cycle_chauffe_en_cours)) {
        return id(pid_climate).target_temperature;
      } else {
        return 0.0f;
      }

text_sensor:
  - platform: template
    name: "R1 Etat"
    id: r1_etat
    update_interval: never

  - platform: template
    name: "R1 Debug Court"
    id: r1_debug_court
    update_interval: 60s
    lambda: |-
      char buffer[300];

      const char *etat = id(r1_etat).state.c_str();
      std::string mode = std::string(id(mode_fonctionnement).current_option());

      snprintf(buffer, sizeof(buffer),
        "Etat:%s | Mode:%s | Arme:%d | Chauffe:%d | Sans dem:%dmin | Demoulages:%d | Entretiens:%d | Td:%.1fC | Tr:%.1fC | Bac:%.1fC",
        etat,
        mode.c_str(),
        id(r1_demoulage_arme),
        id(r1_cycle_chauffe_en_cours),
        id(r1_minutes_sans_demoulage),
        id(r1_compteur_demoulage),
        id(r1_compteur_entretien),
        id(temp_ds18b20_d).state,
        id(temp_ds18b20_r).state,
        id(temp_bac_frigo_esp179).state
      );

      return std::string(buffer);

button:
  - platform: template
    name: "PID Climate Autotune"
    on_press:
      - climate.pid.autotune: pid_climate

  - platform: template
    name: "R1 Test PID Demoulage"
    on_press:
      - script.execute: r1_pid_demoulage

  - platform: template
    name: "R1 Test PID Entretien"
    on_press:
      - script.execute: r1_pid_entretien

  - platform: template
    name: "R1 Reset compteur sans demoulage"
    on_press:
      - lambda: |-
          id(r1_minutes_sans_demoulage) = 0;
          id(r1_etat).publish_state("Repos");
          ESP_LOGI("r1", "Compteur sans demoulage remis a zero");

  - platform: template
    name: "R1 Reset compteur demoulage"
    on_press:
      - lambda: |-
          id(r1_compteur_demoulage) = 0;
          ESP_LOGI("r1", "Compteur demoulage remis a zero");

  - platform: template
    name: "R1 Reset compteur entretien"
    on_press:
      - lambda: |-
          id(r1_compteur_entretien) = 0;
          ESP_LOGI("r1", "Compteur entretien remis a zero");

output:
  - platform: ledc
    pin: GPIO23
    frequency: 1000 Hz
    id: pwm_heater
    max_power: 100%

script:
  # Applique un mode de fonctionnement : "Auto", "Manu" ou "Arrêt".
  - id: appliquer_mode
    mode: restart
    parameters:
      mode: string
    then:
      # Dans tous les cas : on repart d'un etat propre
      - script.stop: r1_pid_demoulage
      - script.stop: r1_pid_entretien
      - climate.control:
          id: pid_climate
          mode: "OFF"
      - lambda: |-
          id(r1_cycle_chauffe_en_cours) = false;
          id(r1_demoulage_arme) = false;
          id(r1_chauffe_start_ms) = 0;
          id(r1_minutes_sans_demoulage) = 0;
          ESP_LOGI("r1", "Mode de fonctionnement : %s", mode.c_str());

      - if:
          condition:
            lambda: 'return mode == "Auto";'
          then:
            - lambda: |-
                id(r1_etat).publish_state("Repos");

      - if:
          condition:
            lambda: 'return mode == "Manu";'
          then:
            # Regulation PID de chauffe R1 forcee (securite temperature max active)
            - lambda: |-
                id(r1_cycle_chauffe_en_cours) = true;
                id(r1_chauffe_start_ms) = millis();
                id(r1_etat).publish_state("Manuel");
            - climate.control:
                id: pid_climate
                mode: HEAT
                target_temperature: !lambda 'return id(r1_consigne_pid_manuel).state;'

      - if:
          condition:
            lambda: 'return mode == "Arrêt";'
          then:
            - lambda: |-
                id(r1_etat).publish_state("Arret");

  - id: r1_pid_demoulage
    mode: single
    then:
      - if:
          condition:
            lambda: |-
              return id(mode_fonctionnement).current_option() == "Auto";
          then:
            - lambda: |-
                id(r1_cycle_chauffe_en_cours) = true;
                id(r1_minutes_sans_demoulage) = 0;
                id(r1_chauffe_start_ms) = millis();
                id(r1_compteur_demoulage)++;
                id(r1_etat).publish_state("PID demoulage");
                ESP_LOGI("r1", "PID demoulage #%d debut : consigne %.1f C, duree min chauffe %.1f min, maxi %.1f min, arret retour froid <= %.1f C",
                         id(r1_compteur_demoulage),
                         id(r1_consigne_pid_demoulage).state,
                         id(r1_duree_min_chauffe).state,
                         id(r1_duree_maxi_pid_demoulage).state,
                         id(r1_seuil_froid_armement).state);


            - climate.control:
                id: pid_climate
                mode: HEAT
                target_temperature: !lambda 'return id(r1_consigne_pid_demoulage).state;'

            # Duree minimale garantie : aucune condition de sortie verifiee avant ce delai.
            - delay: !lambda |-
                return (uint32_t)(id(r1_duree_min_chauffe).state * 60000.0f);

            - lambda: |-
                ESP_LOGI("r1", "PID demoulage : duree min chauffe atteinte, maintien jusqu'au retour froid ou timeout");

            - wait_until:
                condition:
                  or:
                    - lambda: |-
                        if (isnan(id(temp_ds18b20_d).state)) return false;
                        return id(temp_ds18b20_d).state <= id(r1_seuil_froid_armement).state;

                    - lambda: |-
                        uint32_t duree_max_ms = (uint32_t)(id(r1_duree_maxi_pid_demoulage).state * 60000.0f);
                        return (millis() - id(r1_chauffe_start_ms)) >= duree_max_ms;

            - lambda: |-
                uint32_t duree_s = (millis() - id(r1_chauffe_start_ms)) / 1000;
                ESP_LOGI("r1", "PID demoulage arret apres %u s : temp degivrage %.1f C / seuil froid %.1f C",
                         duree_s,
                         id(temp_ds18b20_d).state,
                         id(r1_seuil_froid_armement).state);

            - climate.control:
                id: pid_climate
                mode: "OFF"


            - lambda: |-
                id(r1_cycle_chauffe_en_cours) = false;
                id(r1_chauffe_start_ms) = 0;
                id(r1_etat).publish_state("Repos");
                ESP_LOGI("r1", "PID demoulage fin : PID OFF");

  - id: r1_pid_entretien
    mode: single
    then:
      - if:
          condition:
            lambda: |-
              return id(mode_fonctionnement).current_option() == "Auto";
          then:
            - lambda: |-
                id(r1_cycle_chauffe_en_cours) = true;
                id(r1_minutes_sans_demoulage) = 0;
                id(r1_chauffe_start_ms) = millis();
                id(r1_compteur_entretien)++;
                id(r1_etat).publish_state("PID entretien");
                ESP_LOGI("r1", "PID entretien #%d debut : consigne %.1f C, duree min chauffe %.1f min, duree maxi %.1f min, seuil bac %.1f C",
                         id(r1_compteur_entretien),
                         id(r1_consigne_pid_entretien).state,
                         id(r1_duree_min_chauffe).state,
                         id(r1_duree_maxi_pid_entretien).state,
                         id(r1_seuil_securite_bac_entretien).state);


            - climate.control:
                id: pid_climate
                mode: HEAT
                target_temperature: !lambda 'return id(r1_consigne_pid_entretien).state;'

            # Duree minimale garantie (meme parametre que le demoulage) :
            # la securite bac n'est pas verifiee avant ce delai.
            - delay: !lambda |-
                return (uint32_t)(id(r1_duree_min_chauffe).state * 60000.0f);

            - lambda: |-
                ESP_LOGI("r1", "PID entretien : duree min chauffe atteinte, maintien jusqu'au seuil bac ou timeout");

            - wait_until:
                condition:
                  or:
                    - lambda: |-
                        if (isnan(id(temp_bac_frigo_esp179).state)) return false;
                        return id(temp_bac_frigo_esp179).state >= id(r1_seuil_securite_bac_entretien).state;

                    - lambda: |-
                        uint32_t duree_max_ms = (uint32_t)(id(r1_duree_maxi_pid_entretien).state * 60000.0f);
                        return (millis() - id(r1_chauffe_start_ms)) >= duree_max_ms;

            - lambda: |-
                uint32_t duree_s = (millis() - id(r1_chauffe_start_ms)) / 1000;
                ESP_LOGI("r1", "PID entretien arret apres %u s : bac %.1f C / seuil %.1f C / temp R %.1f C / temp D %.1f C",
                         duree_s,
                         id(temp_bac_frigo_esp179).state,
                         id(r1_seuil_securite_bac_entretien).state,
                         id(temp_ds18b20_r).state,
                         id(temp_ds18b20_d).state);

            - climate.control:
                id: pid_climate
                mode: "OFF"


            - lambda: |-
                id(r1_cycle_chauffe_en_cours) = false;
                id(r1_chauffe_start_ms) = 0;
                id(r1_etat).publish_state("Repos");
                ESP_LOGI("r1", "PID entretien fin : PID OFF");

interval:
  - interval: 10s
    then:
      - lambda: |-
          id(r1_demoulage_arme_sensor).publish_state(id(r1_demoulage_arme));
          id(r1_chauffe_en_cours_sensor).publish_state(id(r1_cycle_chauffe_en_cours));
      - if:
          condition:
            and:
              - lambda: |-
                  return id(mode_fonctionnement).current_option() == "Auto";
              - lambda: |-
                  return !id(r1_cycle_chauffe_en_cours);
          then:
            - if:
                condition:
                  lambda: |-
                    if (isnan(id(temp_ds18b20_d).state)) return false;
                    return id(temp_ds18b20_d).state <= id(r1_seuil_froid_armement).state;
                then:
                  - lambda: |-
                      if (!id(r1_demoulage_arme)) {
                        id(r1_demoulage_arme) = true;
                        id(r1_etat).publish_state("Arme demoulage");
                        ESP_LOGI("r1", "Demoulage arme : temp degivrage %.1f C",
                                 id(temp_ds18b20_d).state);
                      }

            - if:
                condition:
                  lambda: |-
                    if (isnan(id(temp_ds18b20_d).state)) return false;
                    return id(r1_demoulage_arme)
                        && id(temp_ds18b20_d).state >= id(r1_seuil_detection_demoulage).state;
                then:
                  - lambda: |-
                      id(r1_demoulage_arme) = false;
                      id(r1_minutes_sans_demoulage) = 0;
                      ESP_LOGI("r1", "Demoulage detecte : temp degivrage %.1f C",
                               id(temp_ds18b20_d).state);
                  - script.execute: r1_pid_demoulage

  - interval: 1min
    then:
      - if:
          condition:
            and:
              - lambda: |-
                  return id(mode_fonctionnement).current_option() == "Auto";
              - lambda: |-
                  return !id(r1_cycle_chauffe_en_cours);
          then:
            - lambda: |-
                id(r1_minutes_sans_demoulage)++;

            - if:
                condition:
                  lambda: |-
                    int delai_min = (int)(id(r1_delai_entretien_h).state * 60.0f);
                    return id(r1_minutes_sans_demoulage) >= delai_min;
                then:
                  - lambda: |-
                      ESP_LOGI("r1", "Entretien declenche : aucun demoulage depuis %d min",
                               id(r1_minutes_sans_demoulage));
                  - script.execute: r1_pid_entretien

  - interval: 5s
    then:
      - if:
          condition:
            lambda: |-
              if (isnan(id(temp_ds18b20_r).state)) return false;
              return id(r1_cycle_chauffe_en_cours)
                  && id(temp_ds18b20_r).state >= id(r1_temperature_securite_max).state;
          then:
            - logger.log: "SECURITE R1 : temperature max atteinte, coupure PID"
            - script.stop: r1_pid_demoulage
            - script.stop: r1_pid_entretien
            - climate.control:
                id: pid_climate
                mode: "OFF"
            - lambda: |-
                id(r1_cycle_chauffe_en_cours) = false;
                id(r1_demoulage_arme) = false;
                id(r1_chauffe_start_ms) = 0;
                id(r1_etat).publish_state("Securite temperature");

climate:
  - platform: pid
    id: pid_climate
    name: "Regulation PID"
    sensor: temp_ds18b20_r
    default_target_temperature: 6°C
    heat_output: pwm_heater
    control_parameters:
      kp: 0.37040
      ki: 0.02178
      kd: 1.5750
      output_averaging_samples: 5
