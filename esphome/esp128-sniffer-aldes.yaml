substitutions:
  device_name: esp128
  friendly_name: esp128
  adress_ip: "192.168.0.128"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32dev

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  manual_ip:
    static_ip: ${adress_ip}
    gateway: 192.168.0.254
    subnet: 255.255.255.0
    dns1: !secret dns1
    dns2: !secret dns2

logger:
  level: DEBUG

api:

ota:
  platform: esphome

web_server:
  port: 80

uart:
  id: ibus
  tx_pin:
    number: GPIO17
    inverted: true
  rx_pin:
    number: GPIO16
    inverted: true
  baud_rate: 2400
  data_bits: 8
  parity: EVEN
  stop_bits: 1
  debug:
    direction: BOTH
    dummy_receiver: true
    after:
      timeout: 50ms
    sequence:
      - lambda: |-
          ESP_LOGD("ibus", "%s", format_hex_pretty(bytes).c_str());
          uint8_t sum = 0;
          for (size_t i = 0; i < bytes.size(); i++) sum += bytes[i];
          if (direction == UART_DIRECTION_TX) {
            ESP_LOGI("ibus_tx", "%s", format_hex_pretty(bytes).c_str());
            id(ibus_derniere_trame_envoyee).publish_state(format_hex_pretty(bytes));
            return;
          }
          id(ibus_derniere_trame_recue).publish_state(format_hex_pretty(bytes));

          // Trame sondage 18 octets : 00 40 0F FA
          // Octet 6 (bytes[5]) : 0x0B = bypass ON, 0x08 = bypass OFF
          if (bytes.size() == 18 && bytes[0] == 0x00 && bytes[1] == 0x40) {
            if (sum != 0xFF) { id(ibus_erreurs_checksum) += 1; return; }
            id(ibus_trames_valides) += 1;
            id(ibus_mode_demande).publish_state(bytes[4]);
            id(ibus_consigne1).publish_state(bytes[6] | (bytes[7] << 8));
            id(ibus_consigne2).publish_state(bytes[8] | (bytes[9] << 8));
            if (bytes[5] == 0x0B) id(ibus_bypass_actif).publish_state(true);
            else if (bytes[5] == 0x08) id(ibus_bypass_actif).publish_state(false);
            return;
          }

          // Trame commande ponctuelle 18 octets : 00 00 11 FB
          if (bytes.size() == 18 && bytes[0] == 0x00 && bytes[1] == 0x00 &&
              bytes[2] == 0x11 && bytes[3] == 0xFB) {
            if (sum != 0x00) { id(ibus_erreurs_checksum) += 1; return; }
            id(ibus_commandes) += 1;
            ESP_LOGI("ibus", "Commande vitesse %d, consigne %d",
                     bytes[5], bytes[11] | (bytes[12] << 8));
            return;
          }

          // Trame reponse 32 octets : 40 00 1D 31
          if (bytes.size() == 32 && bytes[0] == 0x40 && bytes[1] == 0x00) {
            if (sum != 0x3F) { id(ibus_erreurs_checksum) += 1; return; }
            id(ibus_trames_valides) += 1;
            id(ibus_debit_soufflage).publish_state(bytes[12] | (bytes[13] << 8));
            id(ibus_debit_extraction).publish_state(bytes[16] | (bytes[17] << 8));
            id(ibus_temp_air_neuf).publish_state(bytes[7] - 40);
            id(ibus_temp_aspiration_logement).publish_state(bytes[8] - 40);
            // Test : octets candidats (1-based 7, 10 et 11) convertis en °C (octet - 40)
            id(ibus_temp_octet7).publish_state(bytes[6] - 40);
            id(ibus_temp_octet10).publish_state(bytes[9] - 40);
            id(ibus_temp_octet11).publish_state(bytes[10] - 40);
            return;
          }

          id(ibus_erreurs_sync) += 1;

globals:
  - id: ibus_trames_valides
    type: int
    restore_value: false
    initial_value: '0'
  - id: ibus_erreurs_checksum
    type: int
    restore_value: false
    initial_value: '0'
  - id: ibus_erreurs_sync
    type: int
    restore_value: false
    initial_value: '0'
  - id: ibus_commandes
    type: int
    restore_value: false
    initial_value: '0'

sensor:
  - platform: template
    name: "IBUS Mode demande"
    id: ibus_mode_demande
    state_class: measurement
    accuracy_decimals: 0

  - platform: template
    name: "IBUS Consigne 1"
    id: ibus_consigne1
    state_class: measurement
    accuracy_decimals: 0

  - platform: template
    name: "IBUS Consigne 2"
    id: ibus_consigne2
    state_class: measurement
    accuracy_decimals: 0

  - platform: template
    name: "IBUS Debit mesure 1"
    id: ibus_debit_soufflage
    state_class: measurement
    accuracy_decimals: 0

  - platform: template
    name: "IBUS Debit mesure 2"
    id: ibus_debit_extraction
    state_class: measurement
    accuracy_decimals: 0

  - platform: template
    name: "IBUS Temp Air Neuf"
    id: ibus_temp_air_neuf
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 0

  - platform: template
    name: "IBUS Temp Aspiration Logement"
    id: ibus_temp_aspiration_logement
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 0

  - platform: template
    name: "IBUS Temp octet 7"
    id: ibus_temp_octet7
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 0

  - platform: template
    name: "IBUS Temp octet 10"
    id: ibus_temp_octet10
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 0

  - platform: template
    name: "IBUS Temp octet 11"
    id: ibus_temp_octet11
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 0

  - platform: template
    name: "IBUS Trames valides"
    lambda: 'return id(ibus_trames_valides);'
    update_interval: 10s
    state_class: total_increasing
    accuracy_decimals: 0
    entity_category: diagnostic

  - platform: template
    name: "IBUS Commandes vues"
    lambda: 'return id(ibus_commandes);'
    update_interval: 10s
    state_class: total_increasing
    accuracy_decimals: 0
    entity_category: diagnostic

  - platform: template
    name: "IBUS Erreurs checksum"
    lambda: 'return id(ibus_erreurs_checksum);'
    update_interval: 10s
    state_class: total_increasing
    accuracy_decimals: 0
    entity_category: diagnostic

  - platform: template
    name: "IBUS Erreurs sync"
    lambda: 'return id(ibus_erreurs_sync);'
    update_interval: 10s
    state_class: total_increasing
    accuracy_decimals: 0
    entity_category: diagnostic

text_sensor:
  - platform: template
    name: "IBUS Derniere trame Reçue"
    id: ibus_derniere_trame_recue
  - platform: template
    name: "IBUS Derniere trame Envoyee"
    id: ibus_derniere_trame_envoyee

binary_sensor:
  - platform: template
    name: "IBUS Bypass actif"
    id: ibus_bypass_actif

button:
  - platform: template
    name: "IBUS Envoyer V1"
    id: ibus_envoyer_v1
    on_press:
      - uart.write:
          id: ibus
          data: [0x00, 0x00, 0x11, 0xFB, 0x00, 0x01, 0x00, 0x00, 0x0B, 0x00, 0x00, 0x9A, 0x5F, 0x00, 0x00, 0x00, 0xFA, 0xF5]

  - platform: template
    name: "IBUS Envoyer V2"
    id: ibus_envoyer_v2
    on_press:
      - uart.write:
          id: ibus
          data: [0x00, 0x00, 0x11, 0xFB, 0x00, 0x02, 0x00, 0x00, 0x0B, 0x00, 0x00, 0x9A, 0x9B, 0x00, 0x00, 0x00, 0xFA, 0xB8]

  - platform: template
    name: "IBUS Envoyer V3"
    id: ibus_envoyer_v3
    on_press:
      - uart.write:
          id: ibus
          data: [0x00, 0x00, 0x11, 0xFB, 0x00, 0x03, 0x00, 0x00, 0x0D, 0x00, 0x00, 0x9A, 0x2C, 0x01, 0x00, 0x00, 0xFA, 0x23]

  - platform: template
    name: "IBUS Bypass ON"
    id: ibus_bypass_on
    on_press:
      - uart.write:
          id: ibus
          data: [0x00, 0x00, 0x11, 0xFB, 0x00, 0x01, 0x0F, 0x00, 0xB3, 0x00, 0x00, 0x9A, 0x5F, 0x00, 0x00, 0x00, 0xFA, 0x3E]

  - platform: template
    name: "IBUS Bypass OFF"
    id: ibus_bypass_off
    on_press:
      - uart.write:
          id: ibus
          data: [0x00, 0x00, 0x11, 0xFB, 0x00, 0x01, 0x0C, 0x00, 0xC3, 0x00, 0x00, 0x9A, 0x5F, 0x00, 0x00, 0x00, 0xFA, 0x31]