substitutions:
  device_name: "esp137-vmc"
  friendly_name: esp137
  adress_ip: "192.168.0.137"
  time_timezone: "Europe/Paris"
  
esphome:
  name: ${device_name}
  friendly_name: esp137-vmc

esp8266:
  board: d1_mini
  framework:
    version: recommended  
  
wifi:
  networks:
    - ssid: !secret wifi_esp
      password: !secret mdpwifi_esp
      priority: 1
    - ssid: !secret wifi
      password: !secret mdpwifi
      priority: 0
  reboot_timeout: 5min
  min_auth_mode: WPA2  
  manual_ip:
    static_ip: ${adress_ip}
    gateway: 192.168.0.254
    subnet: 255.255.255.0
    dns1: !secret dns1
    dns2: !secret dns2

logger:
  level: DEBUG

api:
  
ota:
  platform: esphome

web_server:
  port: 80

one_wire:
  - platform: gpio  
    pin: GPIO16

# ------------------------  Variables de la régulation
# Commande de la VMC : désormais envoyée directement à l'esp128 (émetteur/sniffer IBUS)
# via un service Home Assistant (button.press sur ses boutons "IBUS Envoyer V1/V2/V3").
# L'ancien pilotage par relais (impulsions 2s/6s + vérification par la puissance mesurée)
# est supprimé : esp137 ne fait plus que calculer la consigne et la transmettre.
globals:
  - id: auto_actif        # true si le mode est "Automatique"
    type: bool
    initial_value: 'false'
  - id: consigne          # vitesse voulue : 1, 2 ou 3
    type: int
    initial_value: '1'
  - id: depasse_actif     # true tant qu'un seuil haut est dépassé
    type: bool
    initial_value: 'false'
  - id: t_depasse         # millis() du début du dépassement
    type: unsigned long
    initial_value: '0'
  - id: normal_actif      # true tant que tout est revenu sous les seuils
    type: bool
    initial_value: 'false'
  - id: t_normal          # millis() du début du retour à la normale
    type: unsigned long
    initial_value: '0'
  - id: plafond_froid     # vitesse max autorisée selon la température de l'air neuf (1, 2 ou 3)
    type: int
    initial_value: '3'

# Sélecteur de mode (Manuel ou Automatique)
select:
  - platform: template
    name: "Mode VMC"
    id: vmc_mode
    options:
      - "Manuel"
      - "Automatique"
    optimistic: true
    restore_value: true    
    on_value:
      then:
        - lambda: |-
            id(auto_actif) = (x == "Automatique");
            id(consigne) = 1;
            id(depasse_actif) = false;
            id(normal_actif) = false;
        - if:
            condition:
              lambda: 'return id(auto_actif);'
            then:
              - script.execute: calcul_mode_auto_v1
        - logger.log:
            format: "Mode VMC changé en : %s"
            args: [ 'x.c_str()' ]
            level: INFO
            
# Input Number pour les seuils et les délais
number:
  # Délais de la régulation (en secondes)
  - platform: template
    name: "Délai montée V3"
    id: delai_montee
    optimistic: true
    restore_value: true
    initial_value: 600
    mode: box
    min_value: 0
    max_value: 7200
    step: 10
    unit_of_measurement: "s"
    icon: mdi:timer-sand

  - platform: template
    name: "Délai retour V1"
    id: delai_retour
    optimistic: true
    restore_value: true
    initial_value: 300
    mode: box
    min_value: 0
    max_value: 7200
    step: 10
    unit_of_measurement: "s"
    icon: mdi:timer-sand

  # Limitation par temps froid (température de l'air neuf, hystérésis fixe 1 °C)
  #   air neuf < "Temp limite V2" : vitesse limitée à V2
  #   air neuf < "Temp limite V1" : vitesse limitée à V1
  #   Le CO (seuils haut / très haut) n'est JAMAIS limité par le froid.
  - platform: template
    name: "Temp limite V2"
    id: temp_limite_v2
    optimistic: true
    restore_value: true
    initial_value: 5
    mode: box
    min_value: -20
    max_value: 30
    step: 0.5
    unit_of_measurement: "°C"
    device_class: temperature

  - platform: template
    name: "Temp limite V1"
    id: temp_limite_v1
    optimistic: true
    restore_value: true
    initial_value: 0
    mode: box
    min_value: -20
    max_value: 30
    step: 0.5
    unit_of_measurement: "°C"
    device_class: temperature

  # Seuils pour le CO2
  - platform: template
    name: "Seuil Haut CO2"
    id: seuil_haut_co2
    optimistic: true
    restore_value: true
    initial_value: 700
    mode: box
    min_value: 0
    max_value: 1500
    step: 1
    unit_of_measurement: "ppm"
    device_class: carbon_dioxide

  - platform: template
    name: "Seuil Très Haut CO2"
    id: seuil_tres_haut_co2
    optimistic: true
    restore_value: true
    initial_value: 1000
    mode: box
    min_value: 0
    max_value: 3000
    step: 1
    unit_of_measurement: "ppm"
    device_class: carbon_dioxide

  # Seuils pour le PM2.5
  - platform: template
    name: "Seuil Haut PM2.5"
    id: seuil_haut_pm25
    optimistic: true
    restore_value: true
    initial_value: 35
    mode: box
    min_value: 0
    max_value: 1000
    step: 1
    unit_of_measurement: "µg/m³"
    device_class: pm25

  - platform: template
    name: "Seuil Très Haut PM2.5"
    id: seuil_tres_haut_pm25
    optimistic: true
    restore_value: true
    initial_value: 100
    mode: box
    min_value: 0
    max_value: 2000
    step: 1
    unit_of_measurement: "µg/m³"
    device_class: pm25

  # Seuils pour le CO
  - platform: template
    name: "Seuil Haut CO"
    id: seuil_haut_co
    optimistic: true
    restore_value: true
    initial_value: 25
    mode: box
    min_value: 0
    max_value: 100
    step: 1
    unit_of_measurement: "ppm"
    device_class: carbon_monoxide

  - platform: template
    name: "Seuil Très Haut CO"
    id: seuil_tres_haut_co
    optimistic: true
    restore_value: true
    initial_value: 50
    mode: box
    min_value: 0
    max_value: 200
    step: 1
    unit_of_measurement: "ppm"
    device_class: carbon_monoxide

sensor:
  - platform: dallas_temp
    address: 0xf9000000bc93d328
    name: "Temp Air Neuf"
    id: out
    update_interval: 10s
    device_class: temperature
    accuracy_decimals: 2

  - platform: dallas_temp
    address: 0xa2000000bca51728
    name: "Temp Air Vicié"
    id: airv
    update_interval: 10s
    device_class: temperature
    accuracy_decimals: 2

  - platform: dallas_temp
    address: 0x10000000bdc55428
    name: "Temp insufflation"
    id: insuf
    update_interval: 10s
    device_class: temperature
    accuracy_decimals: 2

  - platform: dallas_temp
    address: 0xc1000000bced2428
    name: "Temp aspiration"
    id: aspi
    update_interval: 10s
    device_class: temperature
    accuracy_decimals: 2
    
  - platform: dallas_temp
    address: 0xbc01a14909646128
    name: "Temp Combles"
    id: combles
    update_interval: 10s
    device_class: temperature
    accuracy_decimals: 2

  - platform: homeassistant
    entity_id: sensor.ecocompteur_vmc_niv0
    id: pu
    unit_of_measurement: "W"
    device_class: power

  # Récupérer les valeurs de CO2, PM2.5 et CO depuis Home Assistant
  - platform: homeassistant
    entity_id: sensor.esp145_mh_z19_co2_value
    id: co2_value
    unit_of_measurement: "ppm"
    internal: true

  # PM2.5 lissé (moyenne glissante) pour ignorer les pics brefs
  - platform: homeassistant
    entity_id: sensor.esp145_conc_particules_2_5mm
    id: pm25_value
    unit_of_measurement: "µg/m³"
    internal: true


  # CO : détecteur X-Sense du salon (pas de lissage, réaction directe)
  - platform: homeassistant
    entity_id: sensor.df_co_salon_co_lecture
    id: co_value
    unit_of_measurement: "ppm"
    internal: true

  # Vitesse mesurée d'après la puissance (diagnostic uniquement, ne pilote plus rien)
  # Mesures : V1 ~ 20-31 W | V2 ~ 49 W | V3 ~ 82-100 W
  # Bornes = milieu entre deux vitesses : 40 W et 67 W
  - platform: template
    name: "Vitesse mesurée"
    id: vit_mesuree
    icon: mdi:fan
    update_interval: 5s
    accuracy_decimals: 0
    state_class: measurement
    lambda: |-
      float p = id(pu).state;
      if (isnan(p)) {
        return NAN;
      }
      if (p < 2.0) {
        return 0;
      } else if (p <= 40.0) {
        return 1;
      } else if (p <= 67.0) {
        return 2;
      }
      return 3;

  # Consigne de vitesse calculée par le mode Automatique
  - platform: template
    name: "Consigne vitesse"
    id: consigne_aff
    icon: mdi:target
    update_interval: 10s
    accuracy_decimals: 0
    state_class: measurement
    lambda: 'return id(consigne);'

  # Vitesse maximale autorisée par la température de l'air neuf (3 = pas de limite)
  - platform: template
    name: "Plafond froid"
    id: plafond_aff
    icon: mdi:snowflake-alert
    update_interval: 10s
    accuracy_decimals: 0
    state_class: measurement
    lambda: 'return id(plafond_froid);'

  - platform: template
    name: "Rendement soufflage"
    id: rend
    update_interval: 10s
    unit_of_measurement: "%"
    icon: "mdi:percent"
    state_class: "measurement"
    accuracy_decimals: 0
    lambda: |-
      if (isnan(id(insuf).state) || isnan(id(out).state) || isnan(id(aspi).state)) {
        return 0;
      }
      float denom = (id(aspi).state - id(out).state);
      if (denom == 0) {
        return 0;
      }
      float rendement = ((id(insuf).state - id(out).state) / denom) * 100;
      if (rendement >= 100) {
        return 100;
      } else if (rendement < 0) {
        return 0;
      }
      return rendement;

  - platform: template
    name: "Rendement reprise"
    id: rend_reprise
    update_interval: 10s
    unit_of_measurement: "%"
    icon: "mdi:percent"
    state_class: "measurement"
    accuracy_decimals: 0
    lambda: |-
      if (isnan(id(aspi).state) || isnan(id(airv).state) || isnan(id(out).state)) {
        return 0;
      }
      float denom = (id(aspi).state - id(out).state);
      if (denom == 0) {
        return 0;
      }
      float rendement = ((id(aspi).state - id(airv).state) / denom) * 100;
      if (rendement >= 100) {
        return 100;
      } else if (rendement < 0) {
        return 0;
      }
      return rendement;

  - platform: template
    name: "Débit estimé VMC"
    id: debit
    unit_of_measurement: "m³/h"
    icon: "mdi:fan"
    state_class: "measurement"
    update_interval: 60s
    accuracy_decimals: 1
    lambda: |-
      if (isnan(id(pu).state)) {
        return 0;
      }
      float debit = id(pu).state;
      return debit;
    filters:
      - calibrate_polynomial:
          degree: 2
          datapoints:
            - 30.14 -> 90
            - 34.19 -> 105
            - 38.87 -> 120
            - 44.96 -> 135
            - 52.45 -> 150
            - 61.35 -> 165
            - 71.66 -> 180
            - 83.37 -> 195
      - lambda: |-
          if (x < 0) return 0;
          return x;

  - platform: template
    name: "COP VMC"
    device_class: power_factor
    state_class: "measurement"
    unit_of_measurement: ""
    update_interval: 60s
    accuracy_decimals: 2
    lambda: |-
      if (isnan(id(pu).state) || isnan(id(debit).state) || isnan(id(insuf).state) || isnan(id(out).state)) {
        return 0;
      }    
      float debit_air = (id(debit).state / 3600.0);
      float masse_volumique = 1.2;
      float capacite_thermique = 1000.0;
      float pu_thermique = debit_air * masse_volumique * capacite_thermique * 
             (id(insuf).state - id(out).state);    
      float puissance_electrique = id(pu).state;
      if (puissance_electrique == 0) {
        return 0;
      }
      float cop = pu_thermique / puissance_electrique;
      if (cop < 0) {
        return 0;
      }
      return cop;

binary_sensor:

  - platform: template
    name: "Bypass VMC actif"
    id: bypass_actif
    lambda: |-
      if (isnan(id(aspi).state) || isnan(id(out).state) || isnan(id(rend).state) || isnan(id(vit_mesuree).state)) {
        return {};
      }
      if (id(vit_mesuree).state < 1) {
        return false;
      }
      float ecart = id(aspi).state - id(out).state;
      if (fabs(ecart) < 3.0) {
        return {};
      }
      return id(rend).state < 20.0;
      
  - platform: status
    name: "Status"

text_sensor:
  # Affichage Vitesse en clair, déduite de la puissance mesurée
  - platform: template
    id: aff_vitesse
    name: "affich_vitesse"
    icon: mdi:timer
    update_interval: 10s
    lambda: |-
      float v = id(vit_mesuree).state;
      if (isnan(v)) {
        return std::string("Inconnu");
      }
      if (v < 1) {
        return std::string("Arret");
      }
      return std::string("Vit ") + std::to_string((int) v);

# Commande manuelle de la VMC : envoie directement l'ordre de vitesse à l'esp128
# (plus de relais ni d'impulsion ; utile surtout en mode "Manuel", mais fonctionne
# aussi en "Automatique" — dans ce cas la boucle de régulation peut recalculer une
# autre consigne au tick suivant, sous 10 s).
button:
  - platform: template
    name: "VMC Vitesse 1 (Manuel)"
    on_press:
      - lambda: 'id(consigne) = 1;'
      - script.execute:
          id: envoyer_consigne_vmc
          vitesse: 1

  - platform: template
    name: "VMC Vitesse 2 (Manuel)"
    on_press:
      - lambda: 'id(consigne) = 2;'
      - script.execute:
          id: envoyer_consigne_vmc
          vitesse: 2

  - platform: template
    name: "VMC Vitesse 3 (Manuel)"
    on_press:
      - lambda: 'id(consigne) = 3;'
      - script.execute:
          id: envoyer_consigne_vmc
          vitesse: 3

interval:
  # Calcul de la consigne (toutes les 10 s : les délais sont en secondes)
  - interval: 10s
    then:
      - script.execute: calcul_mode_auto_v1

# ------------------------  Scripts
script:
  # Envoi de la consigne de vitesse à l'esp128 (sniffer/émetteur IBUS), qui relaie
  # l'ordre sur le bus de la VMC via ses boutons "IBUS Envoyer V1/V2/V3".
  # ⚠️ Vérifier dans Outils de développement > États (HA) que ces entity_id
  # correspondent bien à celles de vos boutons esp128 ; adapter si besoin.
  - id: envoyer_consigne_vmc
    mode: single
    parameters:
      vitesse: int
    then:
      - logger.log:
          format: "Envoi de la consigne V%d à l'ESP128 (IBUS)"
          args: [ 'vitesse' ]
          level: INFO
      - if:
          condition:
            lambda: 'return vitesse == 1;'
          then:
            - homeassistant.service:
                service: button.press
                data:
                  entity_id: button.cuisine_esp128_ibus_envoyer_v1
      - if:
          condition:
            lambda: 'return vitesse == 2;'
          then:
            - homeassistant.service:
                service: button.press
                data:
                  entity_id: button.cuisine_esp128_ibus_envoyer_v2
      - if:
          condition:
            lambda: 'return vitesse == 3;'
          then:
            - homeassistant.service:
                service: button.press
                data:
                  entity_id: button.cuisine_esp128_ibus_envoyer_v3

  # Calcul de la consigne (1, 2 ou 3) à partir des capteurs
  #  - seuil très haut dépassé     : V3 tout de suite
  #  - seuil haut dépassé          : V2 tout de suite, puis V3 si le dépassement
  #                                  dure plus que "Délai montée V3"
  #  - tout est redevenu normal    : retour en V1 après "Délai retour V1"
  #  - air neuf froid              : vitesse plafonnée (V2 / V1), sauf CO en alerte
  - id: calcul_mode_auto_v1
    mode: single
    then:
      - if:
          condition:
            lambda: 'return id(auto_actif);'
          then:
            - lambda: |-
                auto sup = [&](bool actif, float val, float seuil) {
                  return actif && !isnan(val) && val > seuil;
                };
                bool tres = sup(id(val_co2).state, id(co2_value).state, id(seuil_tres_haut_co2).state)
                         || sup(id(val_co).state, id(co_value).state, id(seuil_tres_haut_co).state)
                         || sup(id(val_pm25).state, id(pm25_value).state, id(seuil_tres_haut_pm25).state);
                bool haut = sup(id(val_co2).state, id(co2_value).state, id(seuil_haut_co2).state)
                         || sup(id(val_co).state, id(co_value).state, id(seuil_haut_co).state)
                         || sup(id(val_pm25).state, id(pm25_value).state, id(seuil_haut_pm25).state);

                // CO en alerte : jamais limité par le froid
                bool co_alerte = sup(id(val_co).state, id(co_value).state, id(seuil_haut_co).state);

                // Plafond de vitesse selon la température de l'air neuf (hystérésis 1 °C)
                float t = id(out).state;
                if (!isnan(t)) {
                  float lim1 = id(temp_limite_v1).state;
                  float lim2 = id(temp_limite_v2).state;
                  int p = id(plafond_froid);
                  if (t < lim1) p = 1;
                  else if (t < lim2 && p == 3) p = 2;
                  if (p == 1 && t >= lim1 + 1.0f) p = 2;
                  if (p == 2 && t >= lim2 + 1.0f) p = 3;
                  id(plafond_froid) = p;
                }
                int cap = co_alerte ? 3 : id(plafond_froid);

                unsigned long now = millis();
                int ancienne = id(consigne);

                if (tres || haut) {
                  // Au moins un seuil est dépassé
                  id(normal_actif) = false;
                  if (!id(depasse_actif)) {
                    id(depasse_actif) = true;
                    id(t_depasse) = now;
                  }
                  if (tres) {
                    id(consigne) = 3;
                  } else if (id(consigne) < 2) {
                    id(consigne) = 2;
                  } else if (id(consigne) == 2
                             && (float)(now - id(t_depasse)) >= id(delai_montee).state * 1000.0f) {
                    id(consigne) = 3;
                  }
                } else {
                  // Tout est sous les seuils
                  id(depasse_actif) = false;
                  if (id(consigne) > 1) {
                    if (!id(normal_actif)) {
                      id(normal_actif) = true;
                      id(t_normal) = now;
                    } else if ((float)(now - id(t_normal)) >= id(delai_retour).state * 1000.0f) {
                      id(consigne) = 1;
                      id(normal_actif) = false;
                    }
                  } else {
                    id(normal_actif) = false;
                  }
                }

                // Application du plafond (froid)
                if (id(consigne) > cap) id(consigne) = cap;

                if (id(consigne) != ancienne) {
                  ESP_LOGI("vmc", "Consigne %d -> %d (plafond V%d, air neuf %.1f, CO2=%.0f CO=%.1f PM2.5=%.1f)",
                           ancienne, id(consigne), cap, id(out).state, id(co2_value).state, id(co_value).state, id(pm25_value).state);
                  id(envoyer_consigne_vmc).execute(id(consigne));
                }

switch:   
  # Validations utilisées par calcul_mode_auto_v1 (seuils actifs ou non)
  - platform: template
    name: "Valid Co"
    id: val_co
    optimistic: True
    restore_mode: RESTORE_DEFAULT_ON
    on_turn_on:
      then:
        - script.execute: calcul_mode_auto_v1
    on_turn_off:
      then:
        - script.execute: calcul_mode_auto_v1

  - platform: template
    name: "Valid Co2"
    id: val_co2
    optimistic: True
    restore_mode: RESTORE_DEFAULT_ON
    on_turn_on:
      then:
        - script.execute: calcul_mode_auto_v1
    on_turn_off:
      then:
        - script.execute: calcul_mode_auto_v1

  - platform: template
    name: "Valid pm25"
    id: val_pm25
    optimistic: True
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      then:
        - script.execute: calcul_mode_auto_v1
    on_turn_off:
      then:
        - script.execute: calcul_mode_auto_v1

  - platform: gpio
    pin: GPIO5
    id: relais_vmc
    name: "Relais VMC (repos)"
    restore_mode: ALWAYS_OFF
    icon: "mdi:electric-switch"          