substitutions:
  device_name: esp138-qualite-air
  adress_ip: "192.168.0.138"
  friendly_name: esp138
  time_timezone: "Europe/Paris"

esphome:
  name: ${device_name}

esp32:
  board: mhetesp32minikit
  #board: wemos_d1_mini32
  framework:
    type: esp-idf
    advanced:
      sram1_as_iram: true

wifi:
  networks:
    - ssid: !secret wifi_esp
      password: !secret mdpwifi_esp
      priority: 1
    - ssid: !secret wifi
      password: !secret mdpwifi
      priority: 0
  reboot_timeout: 5min
  min_auth_mode: WPA2

  manual_ip:
    static_ip: ${adress_ip}
    gateway: 192.168.0.254
    subnet: 255.255.255.0
    dns1: !secret dns1
    dns2: !secret dns2

# Enable logging
logger:
  baud_rate: 0

api:

ota:
  platform: esphome
web_server:
  port: 80

i2c:
  sda: GPIO21 #
  scl: GPIO22 #
  scan: True
  id: bus_a

uart:
  - id: uart_a
    rx_pin: GPIO25 #
    baud_rate: 9600

  - id: uart_b
    rx_pin: GPIO16 # GPIO16
    tx_pin: GPIO17 # GPIO17
    baud_rate: 9600
#    debug:
#      direction: BOTH

globals:
  - id: bp_mode
    type: int
    initial_value: '1'

sensor:
  - platform: pmsx003
    uart_id: uart_a
    type: PMSX003
    pm_1_0:
      name: "Concentration de particules 1.0µm"
      id: pm1_0
      accuracy_decimals: 0
      filters:
        - sliding_window_moving_average:
            window_size: 15
            send_every: 10
            send_first_at: 1
        # MODIF : arrondi réel de la valeur publiée (accuracy_decimals ne fait
        # qu'une suggestion d'affichage HA, ça n'arrondit pas ce que renvoie
        # states() dans un template Jinja).
        - lambda: return round(x);

    pm_2_5:
      name: "Concentration de particules 2.5µm"
      id: pm2_5
      accuracy_decimals: 0
      filters:
        # MODIF : lissage réduit pour la réactivité (pilotage auto de la hotte).
        # window_size 5 / send_every 3 -> ~5s de moyenne glissante, publiée
        # toutes les ~3s pendant la fenêtre ON (au lieu de 15s/10s).
        - sliding_window_moving_average:
            window_size: 5
            send_every: 3
            send_first_at: 1
        - lambda: return round(x);  # MODIF : arrondi réel avant publication

    pm_10_0:
      name: "Concentration de particules 10.0µm"
      id: pm10_0
      accuracy_decimals: 0
      filters:
        - sliding_window_moving_average:
            window_size: 15
            send_every: 10
            send_first_at: 1
        - lambda: return round(x);  # MODIF : arrondi réel avant publication

    pm_0_3um:
      name: "Nb de particules 0.3"
      id: pm_03_um
      unit_of_measurement: "ppd"
      accuracy_decimals: 0

    pm_0_5um:
      name: "Nb de particules 0.5"
      id: pm_05_um
      unit_of_measurement: "ppd"
      accuracy_decimals: 0

    pm_1_0um:
      name: "Nb de particules 1.0"
      id: pm_10_um
      unit_of_measurement: "ppd"
      accuracy_decimals: 0

    pm_2_5um:
      name: "Nb de particules 2.5"
      id: pm_25_um
      unit_of_measurement: "ppd"
      accuracy_decimals: 0

    pm_5_0um:
      name: "Nb de particules 5.0"
      id: pm_50_um
      unit_of_measurement: "ppd"
      accuracy_decimals: 0

    pm_10_0um:
      name: "Nb de particules 10.0"
      id: pm_100_um
      unit_of_measurement: "ppd"
      accuracy_decimals: 0

  - platform: aqi
    name: "European Air Quality Index"
    pm_2_5: pm2_5
    pm_10_0: pm10_0
    calculation_type: CAQI

