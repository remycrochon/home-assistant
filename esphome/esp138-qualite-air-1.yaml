# Entité de "tendance longue" (indicative, non utilisée pour piloter la hotte :
# c'est bien pm2_5 ci-dessus qui est consommé par esp180).
  - platform: template
    name: "Concentration de particules 2.5µm median"
    id: pm2_5_median
    icon: mdi:air-filter  # MODIF : mdi:chemical-weapon remplacé, icône plus appropriée
    unit_of_measurement: µg/m³
    lambda: |-
      return id(pm2_5).state;
    update_interval: 90s  # aligné sur le cycle ON/OFF du capteur
    filters:
      - median:
          window_size: 20   # 20 x 90s = 30 min de fenêtre glissante
          send_every: 20
          send_first_at: 10

binary_sensor:
#Etat de la connection
  - platform: status
    name: "${friendly_name} Status"

# Cycle 90s : 40s ON (30s stabilisation + ~10s de mesure valide) / 50s OFF.
# Duty cycle ~44% : compromis entre durée de vie laser et fiabilité des mesures
# utilisées par la hotte (esp180). Filtrage pm2_5 réduit (voir plus haut) pour
# rester réactif dans la fenêtre ON.
interval:
  - interval: 90s
    then:
      - switch.turn_on: val_mes
      - delay: 40s
      - switch.turn_off: val_mes
      - delay: 50s

switch:
  - platform: gpio
    pin:
      number: GPIO27 #
    id: val_mes
    name: "${friendly_name} Validation mesure"

  - platform: restart
    name: "${friendly_name} Restart"

