# Entité de "tendance longue" (indicative, non utilisée pour piloter la hotte :
# c'est bien pm2_5 ci-dessus qui est consommé par esp180).
  - platform: template
    name: "Concentration de particules 2.5µm median"
    id: pm2_5_median
    icon: mdi:air-filter  # MODIF : mdi:chemical-weapon remplacé, icône plus appropriée
    unit_of_measurement: µg/m³
    lambda: |-
      return id(pm2_5).state;
    update_interval: 90s  # aligné sur le cycle ON/OFF du capteur
    filters:
      - median:
          window_size: 20   # 20 x 90s = 30 min de fenêtre glissante
          send_every: 20
          send_first_at: 10

binary_sensor:
#Etat de la connection
  - platform: status
    name: "${friendly_name} Status"

  # MODIF : import de l'état de la hotte (esp180) pour piloter le cycle du capteur
  - platform: homeassistant
    id: hotte_running
    entity_id: switch.esp180_hotte_hotte
    on_press:
      # Hotte qui démarre -> capteur en continu immédiatement, sans attendre
      # le prochain tick de l'interval (jusqu'à 90s de latence sinon).
      then:
        - switch.turn_on: val_mes

# Hotte à l'arrêt : cycle réduit 90s (40s ON / 50s OFF) pour préserver le laser
# tout en gardant assez de fraîcheur pour l'auto-ON (~50-65s de latence max).
# Hotte en marche : capteur en continu (pas de coupure) pour un pilotage
# réactif des vitesses V1/V2/V3.
interval:
  - interval: 90s
    then:
      - if:
          condition:
            binary_sensor.is_on: hotte_running
          then:
            - switch.turn_on: val_mes
          else:
            - switch.turn_on: val_mes
            - delay: 40s
            # Re-vérifie avant de couper : si la hotte a démarré entre-temps
            # (via on_press ci-dessus ou action manuelle), on ne coupe pas.
            - if:
                condition:
                  binary_sensor.is_off: hotte_running
                then:
                  - switch.turn_off: val_mes
            - delay: 50s

switch:
  - platform: gpio
    pin:
      number: GPIO27 #
    id: val_mes
    name: "${friendly_name} Validation mesure"

  - platform: restart
    name: "${friendly_name} Restart"

