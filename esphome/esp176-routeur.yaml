# Affichage Status bus VE
# 0=Off;1=Low Power;2=Fault;3=Bulk;4=Absorption;5=Float;6=Storage;
# 7=Equalize;8=Passthru;9=Inverting;10=Power assist;11=Power supply;252=External control

# ============================================================================
# esp176-routeur V2 : le calcul de la puissance disponible est fait par Node-RED
#
#   NR (fonction "Pilotage VE + limite MP2 V11")
#     → MQTT nr/mp2/routeur/p_dispo (toutes les 5 s)
#     → HA   sensor.nr_p_dispo_routeur (expire_after: 30 → "unavailable" si NR se tait)
#     → ESP  ce fichier
#
# L'ESP ne fait plus que :
#   - modes Auto / Manu / Arret / Etalonnage + switch "Valid Routeur"
#   - chauffe de nuit (HC) avec hystérésis sur le volume d'eau chaude (seuil bas / haut)
#   - sécurité température triac, pmax, interpolation puissance → % triac
#   - pilotage du gradateur 0-10V, relais surprod, LEDs, afficheur
#
# Perte de liaison NR (valeur indisponible) ou API HA déconnectée → triac à 0 %
# ============================================================================

substitutions:
  device_name: "esp176-routeur"
  friendly_name: esp176
  adress_ip: "192.168.0.176"
  time_timezone: "Europe/Paris"
  # Affectation des GPIO
  GPIO_onewire: "GPIO27"
  GPIO_sda: "GPIO21"
  GPIO_scl: "GPIO22"
  GPIO_tx: "GPIO17"
  GPIO_rx: "GPIO16"
  GPIO_Led_jaune: "GPIO26"
  GPIO_Led_rouge: "GPIO25"
  GPIO_Led_status: "GPIO32"
  GPIO_Relais: "GPIO5"

packages:
  table_pu: !include pack_esp176/table_pu.yaml

esphome:
  name: ${device_name}
  on_boot:
    priority: -100
    # Force tempok au démarrage
    then:
      - binary_sensor.template.publish:
          id: temperatureok
          state: ON

esp32:
  board: esp32dev
  framework:
    type: esp-idf
    advanced:
      minimum_chip_revision: "3.0"

wifi:
  networks:
    - ssid: !secret wifi_esp
      password: !secret mdpwifi_esp
  reboot_timeout: 5min
  min_auth_mode: WPA2
  manual_ip:
    static_ip: ${adress_ip}
    gateway: 192.168.0.254
    subnet: 255.255.255.0
    dns1: !secret dns1
    dns2: !secret dns2

# Utilisez la LED bleue de l'appareil comme LED d'état, qui clignotera s'il y a des avertissements (lent) ou des erreurs (rapide)
status_led:
  pin:
    number: ${GPIO_Led_status} # led jaune
    inverted: true

# Enable logging
logger:
  baud_rate: 0
  level: INFO

# Enable Home Assistant API
api:

ota:
  platform: esphome

web_server:
  port: 80
  version: 3

time:
  - platform: sntp
    id: sntp_time
    timezone: Europe/Paris
    servers:
      - 0.pool.ntp.org
      - 1.pool.ntp.org
      - 2.pool.ntp.org
    on_time:
      # Mise à jour toutes les minutes du mode HP/HC
      - seconds: 0
        minutes: /1
        then:
          - lambda: |-
              auto now = id(sntp_time).now();
              if (!now.is_valid()) {
                return;
              }
              int h = now.hour;   // 0..23

              // HP : de 06:00 à 21:59
              // HC : de 22:00 à 05:59
              bool hp = (h >= 6 && h < 22);
              id(is_hp_hours) = hp; // En production
              //id(is_hp_hours) = !hp; // pour tester

              ESP_LOGD("horaire", "Heure = %02d:%02d → %s", h, now.minute, hp ? "HP" : "HC");

# Protocole I2C
i2c:
  sda: ${GPIO_sda}
  scl: ${GPIO_scl}
  scan: True
  id: bus_a
  frequency: 100kHz

# ----------- GP8403 (DAC) -----------
# Sortie analogique 0..10V sur CH1/CH2
gp8403:
  id: my_gp8403
  voltage: 10V
  model: GP8403
  address: 0x5f

globals:
  # Puissance effectivement appliquée au routeur (après pmax)
  - id: p_dispo
    type: float
    restore_value: no
    initial_value: '0'

  - id: striac
    type: float
    restore_value: no
    initial_value: '0'

  - id: hc_chauffe          # mémorise l'état chauffe HC (hystérésis)
    type: bool
    restore_value: true
    initial_value: 'false'

  # Indique si on est en heures pleines (HP) ou heures creuses (HC)
  # HP : 06:00 → 22:00  ;  HC : 22:00 → 06:00
  - id: is_hp_hours
    type: bool
    restore_value: no
    initial_value: 'true'

  # stocke temporairement le message à envoyer à telegram
  - id: telegram_msg_buffer
    type: std::string
    restore_value: no
    initial_value: '""'

# Sonde Temperature Dallas
one_wire:
  - platform: gpio
    pin: ${GPIO_onewire}

# déclaration des modes de fonctionnement dans des "input select"
select:
  - platform: template
    name: "Mode_Fonctionnement_routeur"
    optimistic: true
    restore_value: true
    options:
      - Auto
      - Manu
      - Arret
      - Etalonnage
    id: _Mode_Fonctionnement_routeur
    on_value:
      then:
        - lambda: |-
            char mess[128];
            snprintf(mess, sizeof(mess), "Mode Fonctionnement Routeur: %s",
                     id(_Mode_Fonctionnement_routeur).current_option().c_str());
            ESP_LOGI("fichier", "Message: %s", mess);
            id(_log_fichier).execute(mess);

        # --- Si Etalonnage : on lance le script dédié ---
        - if:
            condition:
              lambda: 'return id(_Mode_Fonctionnement_routeur).current_option() == "Etalonnage";'
            then:
              - script.execute: etalonnage_striac
            else:
              # On quitte Etalonnage ou on passe en Auto/Manu/Arret :
              # arrêt explicite du script d'étalonnage.
              - script.stop: etalonnage_striac

              # Passage en Manu : remise à zéro + validrouteur OFF
              - if:
                  condition:
                    lambda: 'return id(_Mode_Fonctionnement_routeur).current_option() == "Manu";'
                  then:
                    - lambda: |-
                        id(ctriac_manu).publish_state(0);
                    - switch.turn_off: validrouteur

              # Remise à zéro de la sortie et des affichages intermédiaires
              - lambda: |-
                  id(striac) = 0.0f;
                  id(p_dispo) = 0.0f;
                  id(afstriac).publish_state(0);
                  id(afpdispo).publish_state(0);
              - output.turn_off: out_gradateur_0_10v

              # Recalcul immédiat
              - script.execute: calcul_triac

binary_sensor:
  #Etat de la connection
  - platform: status
    name: "Status"

  - platform: template
    name: "Temp Ok"
    id: temperatureok

  # Liaison avec Node-RED : valeur p_dispo disponible ET API HA connectée
  # (expire_after côté HA → "unavailable" → NaN ici quand NR ne publie plus)
  - platform: template
    name: "Liaison NR"
    id: liaison_nr
    device_class: connectivity
    lambda: |-
      return api::global_api_server->is_connected() && std::isfinite(id(p_dispo_nr).state);

  - platform: template
    name: "ECS Ballon Chaud (Thermostat Coupé)"
    id: ballon_chaud_deduit
    device_class: heat
    lambda: |-
      // Triac actif (>5%) mais quasi aucune puissance réellement consommée par l'ECS
      return (id(striac) > 5.0f) && (id(puecs).state < 15.0f);
    filters:
      - delayed_on: 3min   # confirme l'état avant de le déclarer (évite les à-coups)
      - delayed_off: 30s

# Input Number
number:
  # Consigne triac en mode manuel
  - platform: template
    name: "Consigne Triac en manu"
    id: ctriac_manu
    optimistic: true
    restore_value: true
    mode: box
    min_value: 0
    max_value: 100
    unit_of_measurement: "%"
    step: 1
    icon: mdi:arrow-collapse-vertical

  # Max sortie triac
  - platform: template
    name: "Puissance Max Triac"
    id: pmax
    optimistic: true
    restore_value: true
    mode: box
    min_value: 10
    max_value: 3300
    unit_of_measurement: "W"
    step: 1
    icon: mdi:arrow-collapse-vertical

  # Seuil MAX temperature
  - platform: template
    name: "T Max"
    id: tmax
    optimistic: true
    restore_value: true
    mode: box
    min_value: 0
    max_value: 75
    unit_of_measurement: "C°"
    step: 0.1
    icon: mdi:arrow-collapse-vertical

  # Simul Vol ECS
  - platform: template
    name: "Simul Vol ECS"
    id: volume_ecs_ha_simule
    optimistic: true
    restore_value: true
    mode: box
    min_value: 0
    max_value: 600
    unit_of_measurement: "L"
    step: 1
    icon: mdi:arrow-collapse-vertical

  - platform: template
    name: "Seuil Bas ECS (L)"
    id: seuil_bas_ha
    optimistic: true
    restore_value: true
    mode: box
    min_value: 0
    max_value: 500
    unit_of_measurement: "L"
    step: 5
    icon: mdi:water

  - platform: template
    name: "Seuil Haut ECS (L)"
    id: seuil_haut_ha
    optimistic: true
    restore_value: true
    mode: box
    min_value: 0
    max_value: 500
    unit_of_measurement: "L"
    step: 5
    icon: mdi:water

sensor:
  - platform: wifi_signal # Reports the WiFi signal strength/RSSI in dB
    name: "WiFi Signal dB"
    id: wifi_signal_db
    update_interval: 60s
    entity_category: "diagnostic"

  - platform: copy # Reports the WiFi signal strength in %
    source_id: wifi_signal_db
    name: "WiFi Signal Percent"
    filters:
      - lambda: return min(max(2 * (x + 100.0), 0.0), 100.0);
    unit_of_measurement: "Signal %"
    entity_category: "diagnostic"
    device_class: ""

  ############### TEMPLATE  ######################
  # Sortie triac de 0 à 100%
  - platform: template
    name: "Sortie Triac"
    id: afstriac
    unit_of_measurement: "%"
    state_class: "measurement"
    accuracy_decimals: 2
    filters:
      - or:
          - throttle: 60s
          - delta: 1.0

  # Sortie triac de 0 à 10V
  - platform: template
    name: "Consigne 0-10V (V)"
    id: consigne_0_10v
    unit_of_measurement: "V"
    state_class: measurement
    accuracy_decimals: 2
    update_interval: 1s
    lambda: |-
      // striac = 0..100 (%)
      float pct = id(striac);
      if (pct < 0.0f) pct = 0.0f;
      if (pct > 100.0f) pct = 100.0f;
      return (pct / 100.0f) * 10.0f;
    filters:
      - or:
          - throttle: 60s
          - delta: 0.1

  # Pu disponible appliquée (après pmax)
  - platform: template
    name: "Pu Disponible"
    id: afpdispo
    unit_of_measurement: "W"
    state_class: "measurement"
    accuracy_decimals: 0
    filters:
      - or:
          - throttle: 60s
          - delta: 10

  # -----------------------------------------------------------------
  # Puissance disponible calculée par Node-RED (publiée toutes les 5 s)
  # NaN si NR ne publie plus depuis 30 s (expire_after côté HA)
  # -----------------------------------------------------------------
  - platform: homeassistant
    id: p_dispo_nr
    entity_id: sensor.nr_p_dispo_routeur
    internal: true

  # -----------------------------------------------------------------
  # Puissance ECS EcoCompteur
  # Lecture HA toutes les 5s environ + moyenne glissante sur 5 valeurs
  # -----------------------------------------------------------------
  - platform: homeassistant
    id: puecs
    entity_id: sensor.ecocompteur_ecs
    internal: true
    filters:
      - sliding_window_moving_average:
          window_size: 5
          send_every: 1

  # Sonde Temperature radiateur
  - platform: dallas_temp
    address: 0xeb012112e461b128
    name: "Temp triac"
    id: temp_triac
    update_interval: 60s
    filters:
      - filter_out: NAN

  # Volume d'eau chaude dispo (en L) mesuré par ESP126
  - platform: homeassistant
    id: volume_ecs_ha
    entity_id: sensor.sous_sol_esp139_ecs_ballon_litres_equivalents_40degc
    name: "Volume ECS HA"

# déclaration des "text_sensors"
text_sensor:
  - platform: template
    name: "Mode Regulation"
    id: moderegul

switch:
  - platform: gpio
    name: "Relais"
    pin: ${GPIO_Relais}
    id: relais

  - platform: template
    name: "Valid Routeur"
    id: validrouteur
    optimistic: True
    restore_mode: always_on

  - platform: restart
    name: "Restart"

output:
  #LEDS --------------------------------------
  - id: led_jaune
    platform: gpio
    pin: ${GPIO_Led_jaune}

  - id: led_rouge
    platform: gpio
    pin: ${GPIO_Led_rouge}

  # Pilotage du Variareur LSA-H3P40YB-40A
  - platform: gp8403
    gp8403_id: my_gp8403
    channel: 0
    id: out_gradateur_0_10v

# Affichage
display:
  - platform: lcd_pcf8574
    dimensions: 20x4
    address: 0x27
    update_interval: 20s  # Plus espacé pour alléger la charge CPU
    lambda: |-
      char ligne0[21];
      char ligne1[21];
      char ligne2[21];
      char ligne3[21];

      snprintf(ligne0, sizeof(ligne0), "Pd=%0.0fW Pe=%0.0fW", id(p_dispo), id(puecs).state);
      snprintf(ligne1, sizeof(ligne1), "Tr=%0.1f%% V:%s", id(striac), id(validrouteur).state ? "OK" : "NOK");
      snprintf(ligne2, sizeof(ligne2), "Tp=%0.1fc E:%s", id(temp_triac).state, id(temperatureok).state ? "OK" : "NOK");
      snprintf(ligne3, sizeof(ligne3), "M:%s NR:%s",
               id(_Mode_Fonctionnement_routeur).current_option().c_str(),
               id(liaison_nr).state ? "OK" : "NOK");

      it.print(0, 0, ligne0);
      it.print(0, 1, ligne1);
      it.print(0, 2, ligne2);
      it.print(0, 3, ligne3);

interval:
  - interval: 1s
    then:
      - if:
          condition:
            lambda: |-
              return id(_Mode_Fonctionnement_routeur).current_option() != std::string("Etalonnage");
          then:
            - script.execute: calcul_triac

  - interval: 5s
    then:
      - script.execute: etat_production
      - script.execute: calcul_relais_surprod

########################################################################
script:
  ########################################################################
  # Script : calcul_triac (HP + HC, tous modes sauf Etalonnage)
  #   - la puissance disponible vient de Node-RED
  #   - HC : chauffe seulement si l'hystérésis volume ECS l'autorise
  ########################################################################
  - id: calcul_triac
    mode: single
    then:
      - lambda: |-
          std::string mode_rt(id(_Mode_Fonctionnement_routeur).current_option().c_str());
          const bool is_hp = id(is_hp_hours);
          const bool valid = id(validrouteur).state;

          // --- Liaison Node-RED (valeur disponible + API HA connectée) ---
          float p_nr = id(p_dispo_nr).state;
          const bool nr_ok = api::global_api_server->is_connected() && std::isfinite(p_nr);
          if (!nr_ok || p_nr < 0.0f) p_nr = 0.0f;

          // --- Sécurité température triac ---
          const bool temp_ok = (id(temp_triac).state < (id(tmax).state - 2));
          id(temperatureok).publish_state(temp_ok);

          float pdispo = 0.0f;   // puissance demandée au routeur (W)
          float s = 0.0f;        // sortie triac (%)
          std::string txt;

          if (mode_rt == "Arret") {
            txt = "OFF - Arrêt";

          } else if (mode_rt == "Manu") {
            if (valid) {
              s = id(ctriac_manu).state;
              txt = "Manu";
            } else {
              txt = "Manu - non validé";
            }

          } else if (mode_rt == "Auto") {
            if (!valid) {
              id(hc_chauffe) = false;
              txt = "OFF - Routeur non validé";
            } else if (!temp_ok) {
              id(hc_chauffe) = false;
              txt = "OFF - Température triac";
            } else if (!nr_ok) {
              id(hc_chauffe) = false;
              txt = "OFF - Liaison NR perdue";
            } else if (is_hp) {
              // HP : tout ce que NR met à disposition
              pdispo = p_nr;
              txt = "HP Routage NR";
            } else {
              // HC : hystérésis sur le volume d'eau chaude
              float vol = id(volume_ecs_ha).state;
              float sb  = id(seuil_bas_ha).state;
              float sh  = id(seuil_haut_ha).state;

              if (vol < sb) {
                id(hc_chauffe) = true;
                txt = "HC ON - Volume < SB";
              } else if (vol >= sh) {
                id(hc_chauffe) = false;
                txt = "HC OFF - Volume ≥ SH";
              } else if (id(hc_chauffe)) {
                txt = "HC ON - Maintien";
              } else {
                txt = "HC OFF - Attente";
              }
              if (id(hc_chauffe)) pdispo = p_nr;
            }
          }

          // --- Puissance → % triac (Auto uniquement) ---
          if (mode_rt == "Auto") {
            float pmax_v = id(pmax).state;
            if (!std::isfinite(pmax_v) || pmax_v < 0.0f) pmax_v = 0.0f;
            if (pdispo > pmax_v) pdispo = pmax_v;

            if (pdispo <= 0.0f || id(table_puissance).size() < 2) {
              s = 0.0f;
            } else {
              s = id(table_puissance).back().first;          // défaut = dernier %
              float last_y = id(table_puissance).back().second;
              if (pdispo < last_y) {
                for (size_t k = 1; k < id(table_puissance).size(); k++) {
                  float x0 = id(table_puissance)[k-1].first;   // % Triac
                  float y0 = id(table_puissance)[k-1].second;  // Puissance
                  float x1 = id(table_puissance)[k].first;
                  float y1 = id(table_puissance)[k].second;
                  if (pdispo <= y1) {
                    float dy = y1 - y0;
                    if (fabsf(dy) < 0.0001f) {
                      s = x1;                                  // segment plat
                    } else {
                      s = x0 + (pdispo - y0) * (x1 - x0) / dy; // interpolation linéaire
                    }
                    break;
                  }
                }
              }
            }
          }

          // --- Clamp final 0..100 ---
          if (!std::isfinite(s) || s < 0.0f) s = 0.0f;
          if (s > 100.0f) s = 100.0f;

          id(striac) = s;
          id(p_dispo) = pdispo;
          id(afstriac).publish_state(s);
          id(afpdispo).publish_state(pdispo);

          if (id(moderegul).state != txt) {
            id(moderegul).publish_state(txt);
            ESP_LOGI("regul", "%s | %s | p_nr=%.0fW | p_dispo=%.0fW | Triac=%.1f%%",
                     is_hp ? "HP" : "HC", txt.c_str(), p_nr, pdispo, s);
          }
      - output.set_level:
          id: out_gradateur_0_10v
          level: !lambda 'return id(striac) / 100.0f;'

  ########################################################################
  # Mode Etalonnage Increment S Triac
  ########################################################################
  - id: etalonnage_striac
    mode: restart
    then:
      - lambda: |-
          id(striac) = 0.0;

          // Enregistrement immédiat du point 0%
          {
            char buffer[64];
            snprintf(buffer, sizeof(buffer), "{%.6f,%.6f},", 0.0f, 0.0f);
            std::string mess = buffer;

            ESP_LOGI("striac", "Etalonnage: Triac=0.0%% | Pu ECS forcée=0 W");
            ESP_LOGI("fichier", "Message: %s", mess.c_str());
            id(_log_etalonnage).execute(mess);
          }

      - while:
          condition:
            lambda: |-
              return id(striac) < 100.0f &&
                     id(_Mode_Fonctionnement_routeur).current_option() == "Etalonnage";
          then:
            # Incrément du palier
            - lambda: |-
                id(striac) += 1.0;
                ESP_LOGI("striac", "Etalonnage -> Nouveau palier Triac: %.1f%%", id(striac));

            # Publication des états HA
            - lambda: |-
                id(afstriac).publish_state(id(striac));
                id(afpdispo).publish_state(0);
                id(moderegul).publish_state("Etalonnage");

            # Application sortie 0-10V
            - output.set_level:
                id: out_gradateur_0_10v
                level: !lambda 'return id(striac) / 100.0f;'

            # De 1 à 15%, on force Pu ECS à 0 sans temporisation
            - if:
                condition:
                  lambda: 'return id(striac) <= 15.0f;'
                then:
                  - lambda: |-
                      float pu_ecs = 0.0f;

                      ESP_LOGI("striac", "Etalonnage: Triac=%.1f%% | Pu ECS forcée=0 W | Pas de temporisation",
                               id(striac));

                      char buffer[64];
                      snprintf(buffer, sizeof(buffer), "{%.6f,%.6f},", id(striac), pu_ecs);

                      std::string mess = buffer;

                      ESP_LOGI("fichier", "Message: %s", mess.c_str());
                      id(_log_etalonnage).execute(mess);

                else:
                  # A partir de 16%, temporisation normale de stabilisation
                  - delay: 40s

                  # Lecture puissance ECS filtrée + sécurisation
                  - lambda: |-
                      float pu_ecs = id(puecs).state;

                      // Sécurité si valeur indisponible / nan
                      if (!std::isfinite(pu_ecs)) {
                        ESP_LOGW("striac", "Etalonnage: Triac %.1f%% -> Pu ECS invalide/NAN, forcée à 0 W", id(striac));
                        pu_ecs = 0.0f;
                      }

                      // Une puissance ECS négative n'a pas de sens pour l'étalonnage
                      if (pu_ecs < 0.0f) {
                        ESP_LOGW("striac", "Etalonnage: Triac %.1f%% -> Pu ECS négative %.0f W, forcée à 0 W", id(striac), pu_ecs);
                        pu_ecs = 0.0f;
                      }

                      ESP_LOGI("striac", "Etalonnage: Triac=%.1f%% | Pu ECS filtrée=%.0f W",
                               id(striac), pu_ecs);

                      char buffer[64];
                      snprintf(buffer, sizeof(buffer), "{%.6f,%.6f},", id(striac), pu_ecs);

                      std::string mess = buffer;

                      ESP_LOGI("fichier", "Message: %s", mess.c_str());
                      id(_log_etalonnage).execute(mess);

      - lambda: |-
          if (id(_Mode_Fonctionnement_routeur).current_option() == "Etalonnage") {
            ESP_LOGI("striac", "Fin normale de l'étalonnage, striac = %.2f", id(striac));
          } else {
            ESP_LOGW("striac", "Etalonnage interrompu par changement de mode, striac = %.2f", id(striac));
          }

  ########################################################################
  # ------------  Pilotage led
  #   rouge = routage en cours (triac > 1 %) ; jaune = routeur validé
  ########################################################################
  - id: etat_production
    mode: single
    then:
      - if:
          condition:
            lambda: 'return id(striac) > 1.0f;'
          then:
            - output.turn_on: led_rouge
          else:
            - output.turn_off: led_rouge

      - if:
          condition:
            switch.is_on: validrouteur
          then:
            - output.turn_on: led_jaune
          else:
            - output.turn_off: led_jaune

  ########################################################################
  - id: calcul_relais_surprod
    mode: single
    then:
      - if:
          condition:
            - lambda: 'return (id(striac)>=90 && id(puecs).state<10);'
          then:
            - delay: 300s
            - switch.turn_on: relais
            - logger.log: "Relais Activé"

      - if:
          condition:
            - lambda: 'return id(puecs).state >= 10;'
          then:
            - switch.turn_off: relais
            - logger.log: "Relais Désactivé"

