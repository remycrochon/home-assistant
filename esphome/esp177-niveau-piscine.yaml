substitutions:
  device_name: esp177-niveau-piscine
  address_ip: "192.168.0.177"
  friendly_name: ESP177

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}

esp32:
  board: wt32-eth01
  framework:
    type: esp-idf

logger:
  level: DEBUG

api:

ota:
  - platform: esphome

web_server:
  port: 80

wifi:
  ssid: !secret wifi
  password: !secret mdpwifi
  reboot_timeout: 5min
  manual_ip:
    static_ip: ${address_ip}
    gateway: 192.168.0.254
    subnet: 255.255.255.0
    dns1: !secret dns1
    dns2: !secret dns2

uart:
  id: uart_modbus
  tx_pin: GPIO17
  rx_pin: GPIO5
  baud_rate: 9600
  stop_bits: 1

  debug:
    direction: BOTH
    dummy_receiver: false
    after:
      timeout: 150ms
    sequence:
      - lambda: |-
          UARTDebug::log_string(direction, bytes);

modbus:
  id: modbus_bus
  uart_id: uart_modbus
  flow_control_pin: GPIO33
  send_wait_time: 200ms

modbus_controller:
  - id: afficheur_niveau
    address: 0x01
    modbus_id: modbus_bus
    update_interval: 10s
    command_throttle: 100ms

sensor:
  # Registre F0-1 : valeur affichée par l'afficheur
  - platform: modbus_controller
    modbus_controller_id: afficheur_niveau
    id: niveau_eau_piscine
    name: "Niveau eau piscine"
    address: 0x0001
    register_type: holding
    value_type: U_WORD

    unit_of_measurement: "m"
    device_class: distance
    state_class: measurement
    accuracy_decimals: 3

    filters:
      - multiply: 0.001
      - filter_out: nan

binary_sensor:
  - platform: status
    name: "État ESP177"