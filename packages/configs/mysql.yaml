
# Enregistrement Base de Données externe MySql
# https://www.home-assistant.io/integrations/recorder/
recorder:
  db_url: !secret db_mysql
  auto_purge: true
  auto_repack: true
  commit_interval: 30
  purge_keep_days: 10

  include:
    domains:
      - binary_sensor
      - input_boolean
      - input_datetime
      - input_number
      - input_select
      - number
      - sensor
      - switch
      - light
      - utility_meter
      - vacuum
      - sun
      - device_tracker
      - weather
      - person
      - climate
      - lawn_mower

  exclude:
    domains:
      - camera
      - zone
      - automation
      - cover
      - script
      - alarm_control_panel
      - persistent_notification
      - update
      - conversation
      - tag
      - event
      - notify
      - select
      - remote
      - media_player
      - calendar
      - image
      - time
      - text
      - button
      - group
    entity_globs:
      - sensor.smartshunt_500a_50mv_id_277_time_since_last*
      - sensor.*_rssi_numeric
      - sensor.*_rssi
      - sensor.rssi_*
      - sensor.*_lqi
      - sensor.*_wifi_signal_db
      - sensor.*_wifi_signal_percent
      - sensor.*_wifi_signal_sensor
      - sensor.wifi_strength
      - sensor.*_uptime
      - sensor.*_uptime_sensor
      - sensor.*_uptime_1_day
      - sensor.*_uptime_30_days
      - sensor.*_uptime_365_days      
    entities:
      - sensor.temps_de_fonctionnement_vmc_n0
      - sensor.btc_mm_6h
      - sensor.pc_bureau_uptime_secondes
      - sensor.vp2_datetime
      - sensor.ecocompteur_date_time
      - sensor.victron_mqtt_c0619ab1db0d_vebus_276_vebus_inverter_input_power_l1
      - sensor.victron_mqtt_c0619ab1db0d_vebus_276_vebus_device_0_output_power_l1
      - sensor.victron_mqtt_c0619ab1db0d_system_0_system_grid_power_l1
      - sensor.victron_mqtt_c0619ab1db0d_system_0_system_consumption_power_l1
      - sensor.victron_mqtt_c0619ab1db0d_system_0_system_critical_loads_l1
      - sensor.victron_mqtt_c0619ab1db0d_vebus_276_vebus_device_0_inverted_power
      - sensor.victron_mqtt_c0619ab1db0d_vebus_276_vebus_inverter_dc_power
      - sensor.victron_mqtt_c0619ab1db0d_pvinverter_32_pvinverter_power_l1
      - sensor.victron_mqtt_c0619ab1db0d_vebus_276_vebus_inverter_output_apparent_power_l1
      - sensor.victron_mqtt_c0619ab1db0d_vebus_276_vebus_inverter_input_apparent_power_l1
      - sensor.victron_mqtt_c0619ab1db0d_system_0_system_heartbeat
