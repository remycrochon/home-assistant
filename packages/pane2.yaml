openhasp:
  ecran02:
############### Page 0 All ###############
    objects:
      - obj: "p0b3"
        properties:
          "text": "{{ now().strftime('%H:%M') }}"

      - obj: "p0b4"
        properties:
          "bg_color": >
            {% set couleur = states('sensor.rte_tempo_couleur_actuelle') %}
            {% if couleur == "Bleu" %}
            #0000FF
            {% elif couleur == "Blanc" %}
            #FFFFFF
            {% elif couleur == "Rouge" %}
            #FF0000
            {% else %} 
            #00FF00
            {% endif %}

      - obj: "p0b5"
        properties:
          "text": "\uE6A1 {{'%.1f' | format (states('sensor.vp2_temp_out') |float(0)| round(1)) }}°C"
      - obj: "p0b6"
        properties:
          "text": "\uE606 {{'%.1f' | format (states('sensor.esp178_piscine_temperature_eau')|float(0) | round(1)) }}°C"
          #"text": "\uE2DC {{'%.1f' | format (states('sensor.salon_ts0101_temperature')|float(0) | round(1)) }}°C"

      - obj: "p0b7"
        properties:
          "bg_color": >
            {% set couleur = states('sensor.rte_tempo_prochaine_couleur') %}
            {% if couleur == "Bleu" %}
            #0000FF
            {% elif couleur == "Blanc" %}
            #FFFFFF
            {% elif couleur == "Rouge" %}
            #FF0000
            {% else %} 
            #00FF00
            {% endif %}

      - obj: "p0b8"
        properties:
          "text_color": >
            {% set rssi = state_attr('openhasp.ecran02','rssi') | int(0) %}
            {% if rssi >= -50 %}
              #00ff00
            {% elif rssi >= -60 %}
              #ccff00
            {% elif rssi >= -70 %}
              #ff9100
            {% elif rssi >= -80 %}
              #ff5500
            {% else %}
              #ff0000
            {% endif %}

      - obj: "p0b18" #BP Volet, passe en rouge si alarme portes
        properties:
          "bg_color": "{{ '#ff0000' if is_state('binary_sensor.alarmes_portes', 'on') else '#EE82EE' }}"

############### Page 1 Home ###############
      - obj: "p1b21" # Temp Ext
        properties:
          "text": "{{ states('sensor.vp2_temp_out')|float(0)|round(1) }}°C"
      - obj: "p1b22" # Hum
        properties:
          "text": "{{ states('sensor.vp2_humidity_out')|float(0)|round(0) }}%"
      
      - obj: "p1b31" # Temp Int
        properties:
          "text": "{{ states('sensor.vp2_barometer')|float(0)|round(0) }} mba"
            
      - obj: "p1b41" # Vent
        properties:
          "text": "{{ states('sensor.vp2_win_speed')|float(0)|round(1) }} km/h"
            
      - obj: "p1b51" # pluie
        properties:
          "text": "{{ states('sensor.vp2_rainjour')|float(0)|round(1) }} mm"
            

####### PAGE 2 - HOTTE ############### 

      - obj: "p2b22" # AUTO
        properties:
          "val": '{{ 1 if is_state("switch.esp180_hotte_auto_hotte_pm2_5", "on") else 0 }}'
          "text": '{{ "AUTO" if is_state("switch.esp180_hotte_auto_hotte_pm2_5", "on") else "MANU" | e }}'
          "text_color": "{{ '#00ff00' if is_state('switch.esp180_hotte_auto_hotte_pm2_5', 'on') else '#ffffff' }}" 
        event:
          "up":
            - service: homeassistant.toggle
              target:
                entity_id: "switch.esp180_hotte_auto_hotte_pm2_5"


      - obj: "p2b23" # STOP
        properties:
          "val": '{{ 1 if is_state("switch.esp180_hotte_hotte", "on") else 0 }}'
          "text": '{{ "STOP" if is_state("switch.esp180_hotte_hotte", "on") else "MAR" | e }}'
          "text_color": "{{ '#00ff00' if is_state('switch.esp180_hotte_hotte', 'on') else '#ffffff' }}" 
        event:
          "up":
            - service: homeassistant.toggle
              target:
                entity_id: "switch.esp180_hotte_hotte"

      - obj: "p2b24" # Vitesse 1
        properties:
          "val": '{{ 1 if is_state("switch.esp180_hotte_hotte_v1", "on") else 0 }}'
          "text_color": "{{ '#00ff00' if is_state('switch.esp180_hotte_hotte_v1', 'on') else '#ffffff' }}" 
        event:
          "up":
            - service: homeassistant.toggle
              entity_id: "switch.esp180_hotte_hotte_v1"
      - obj: "p2b25" # Vitesse 2
        properties:
          "val": '{{ 1 if is_state("switch.esp180_hotte_hotte_v2", "on") else 0 }}'
          "text_color": "{{ '#00ff00' if is_state('switch.esp180_hotte_hotte_v2', 'on') else '#ffffff' }}" 
        event:
          "up":
            - service: homeassistant.toggle
              entity_id: "switch.esp180_hotte_hotte_v2"
      - obj: "p2b26" # Vitesse 3
        properties:
          "val": '{{ 1 if is_state("switch.esp180_hotte_hotte_v3", "on") else 0 }}'
          "text_color": "{{ '#00ff00' if is_state('switch.esp180_hotte_hotte_v3', 'on') else '#ffffff' }}" 
        event:
          "up":
            - service: homeassistant.toggle
              entity_id: "switch.esp180_hotte_hotte_v3"
      - obj: "p2b27" # Lumiere
        properties:
          "val": '{{ 1 if is_state("switch.esp180_hotte_hotte_lumiere", "on") else 0 }}'
          "text_color": "{{ '#00ff00' if is_state('switch.esp180_hotte_hotte_lumiere', 'on') else '#ffffff' }}" 
        event:
          "up":
            - service: homeassistant.toggle
              entity_id: "switch.esp180_hotte_hotte_lumiere"
      - obj: "p2b29"
        properties:
          "text": "{{ states('sensor.esp180_hotte_pm2_5_hotte')|float(0)|round(1)}} ppm"
      - obj: "p2b31"
        properties:
          "text": "{{ states('sensor.esp180_hotte_temperature_hotte')|float(0)|round(1)}} C°" 
      - obj: "p2b33"
        properties:
          "text": "{{ states('sensor.esp180_hotte_humidite_hotte')|float(0)|round(1)}} %" 

####### PAGE 3 VMC ############### 
      - obj: "p3b10"
        properties:
          "text": "{{ states('sensor.esp137_vmc_temp_air_vicie')|float(0)|round(1)}}C°" 
      - obj: "p3b11"
        properties:
          "text": "{{ states('sensor.esp137_vmc_temp_air_neuf')|float(0)|round(1)}}C°"
      - obj: "p3b12"
        properties:
          "text": "{{ states('sensor.esp137_vmc_temp_insufflation')|float(0)|round(1)}}C°" 
      - obj: "p3b13"
        properties:
          "text": "{{ states('sensor.esp137_vmc_temp_aspiration')|float(0)|round(1)}}C°"
      - obj: "p3b14"
        properties:
          "text": "{{ states('sensor.esp137_vmc_temp_combles')|float(0)|round(1)}}C°"
      - obj: "p3b16"
        properties:
          "text": "{{ states('sensor.esp137_vmc_rendement')|float(0)|round(0)}} %"
      - obj: "p3b21"
        properties:
          "text": "{{ states('sensor.esp145_conc_particules_2_5mm')|float(0)|round(0)}}"      
      - obj: "p3b31"
        properties:
          "text": "{{ states('sensor.esp137_vmc_cop_vmc')|float(0)|round(1)}}"   
      - obj: "p3b41"
        properties:
          "text": "{{ states('sensor.ecocompteur_vmc_niv0')|float(0)|round(0)}} W"          
      - obj: "p3b51"
        properties:
          "text": "{{ states('sensor.esp145_monoxide_carbon')|float(0)|round(0)}} ppm"             
      - obj: "p3b61"
        properties:
          "text": "{{ states('sensor.esp145_mh_z19_co2_value')|float(0)|round(0)}} ppm"
      - obj: "p3b71"
        properties:
          "text": "{{ states('sensor.esp137_vmc_debit_estime_vmc')|float(0)|round(1)}} m3/h"          
      - obj: "p3b91" # Cde Relais
        properties:
          "val": '{{ 1 if is_state("switch.relais_cde_vmc_niv0_on_off", "on") else 0 }}'
          "text_color": "{{ '#00ff00' if is_state('switch.relais_cde_vmc_niv0_on_off', 'on') else '#ffffff' }}" 
        event:
          "up":
            - service: homeassistant.toggle
              entity_id: "switch.relais_cde_vmc_niv0_on_off"

############### Page 4 ECS ###############
      ###############
      - obj: "p4b10" # Mode régulation + liaison NR
        properties:
          "text": "Reg: {{ states('sensor.esp176_routeur_mode_regulation') }}"
          "text_color": >
            {% set etat = states('sensor.esp176_routeur_mode_regulation') %}
            {% if is_state('binary_sensor.sous_sol_esp176_routeur_liaison_nr', 'off') or etat in ['unavailable','unknown'] %}
            #ff0000
            {% elif etat.startswith('HP') or etat == 'Auto' %}
            #00ff00
            {% else %}
            #ff9800
            {% endif %}

      - obj: "p4b20" # Prod
        properties:
          "text": >
            {% set count = states('sensor.mp2_production_solaire_totale')|int(0) %}
            {% if count >= 1000 %}
              P={{ (count/1000) |round(2)}} kW
            {% else %}
              P={{ count |round(0)}} W
            {% endif %}

      - obj: "p4b21" # Maison
        properties:
          "text": >
            {% set count = states('sensor.victron_mqtt_c0619ab1db0d_vebus_276_vebus_inverter_output_power_l1')|int(0) %}
            {% if count >= 1000 %}
              M={{ (count/1000) |round(2)}} kW
            {% else %}
              M={{ count |round(0)}} W
            {% endif %}

      - obj: "p4b22" # Batterie (remplace l'ancienne consigne batteries)
        properties:
          "text": >
            {% set count = states('sensor.victron_mqtt_c0619ab1db0d_system_0_system_dc_battery_power')|float(0) * -1 %}
            {% if count|abs >= 1000 %}
              B={{ (count/1000) |round(2)}} kW
            {% else %}
              B={{ count |round(0)|int }} W
            {% endif %}

      - obj: "p4b30" # P dispo réelle (Node-RED) en kW
        properties:
          "text": "{{ states('sensor.nr_pdispo_fleche').split(' ')[:2] | join('') }}"
          "text_color": >-
            {% set f = states('sensor.nr_pdispo_fleche').split(' ')[-1] %}
            {% if f == '⬆' %}#00ff00{% elif f == '⬇' %}#ff0000{% else %}#ffffff{% endif %}

      - obj: "p4b31" # Flèche de tendance pdispo
        properties:
          "text": >-
            {% set f = states('sensor.nr_pdispo_fleche').split(' ')[-1] %}
            {{ "\uE05D" if f == '⬆' else ("\uE045" if f == '⬇' else "\uE054") }}
          "text_color": >-
            {% set f = states('sensor.nr_pdispo_fleche').split(' ')[-1] %}
            {% if f == '⬆' %}#00ff00{% elif f == '⬇' %}#ff0000{% else %}#ffffff{% endif %}

      - obj: "p4b40" # S Triac
        properties:
          "text": "{{ states('sensor.esp176_routeur_sortie_triac')|float(0) | round(0) }}"

      - obj: "p4b50" # P ECS
        properties:
          "text": >
            {% set count = states('sensor.ecocompteur_ecs')|float(0) %}
            {% if count >= 1000 %}
              P ECS={{ (count/1000) |round(2)}} kW
            {% else %}
              P ECS={{ count |round(0)|int }} W
            {% endif %}

      - obj: "p4b60" # TEMP Triac
        properties:
          "text": >
            {% set count = states('sensor.esp176_routeur_temp_triac')|int(0) %}
            T Triac={{ count |round(0)}} °C

      - obj: "p4b70" # Temp ECS
        properties:
          "text": >
            {% set volume = states('sensor.sous_sol_esp139_ecs_ballon_litres_equivalents_40degc')|int(0) %}
            VOL={{ volume |round(0)}} L

      - obj: "p4b80" # Bus Ve
        properties:
          "text": >
            {% set etat = states('sensor.victron_mqtt_c0619ab1db0d_vebus_276_vebus_inverter_state') %}
            {{ 'Bus Ve= ' ~ etat }}
          "text_color": >
            {% set etat = states('sensor.victron_mqtt_c0619ab1db0d_vebus_276_vebus_inverter_state') %}
            {{ '#ff0000' if etat in ['off','unavailable'] else '#00ff00' }}

      - obj: "p4b90" # SOC
        properties:
          "text": "SOC= {{ states('sensor.victron_mqtt_c0619ab1db0d_system_0_system_dc_battery_soc')|float(0)|round(0) }} %"
          "text_color": >
            {% set soc = states('sensor.victron_mqtt_c0619ab1db0d_system_0_system_dc_battery_soc')|float(0) %}
            {% if soc < 21 %}
            #ff0000
            {% elif soc < 40 %}
            #ff9800
            {% else %}
            #00ff00
            {% endif %}

      - obj: "p4b100" # PAC
        properties:
          "text": >
            {% set count = states('sensor.ecocompteur_pac')|int(0) %}
            {% if count >= 1000 %}
              PAC={{ (count/1000) |round(2)}} kW
            {% else %}
              PAC={{ count |round(0)}} W
            {% endif %}

      - obj: "p4b110" # Ballon ECS chaud/OK
        properties:
          "text": >
            {{ 'Ballon chaud' if is_state('binary_sensor.sous_sol_esp176_routeur_ecs_ballon_chaud_thermostat_coupe','on') else 'Ballon OK' }}
          "text_color": >
            {{ '#ff9800' if is_state('binary_sensor.sous_sol_esp176_routeur_ecs_ballon_chaud_thermostat_coupe','on') else '#00ff00' }}

      - obj: "p4b120" # Borne VE
        properties:
          "text": >
            {% set count = states('sensor.evcs_hq2603jcduz_power')|float(0) %}
            {% if count >= 1000 %}
              VE={{ (count/1000) |round(2)}} kW
            {% else %}
              VE={{ count |round(0)|int }} W
            {% endif %}
          "text_color": "{{ '#00ff00' if states('sensor.evcs_hq2603jcduz_power')|float(0) > 50 else '#ffffff' }}"      

############### Page 5 Elec (style console Victron) ###############
      ############### Réseau
      - obj: "p5b21" # Puissance (+ soutirage / - injection)
        properties:
          "text": >-
            {% set p = states('sensor.victron_mqtt_c0619ab1db0d_grid_31_grid_power')|float(0) %}
            {{ ('%+.2f kW' | format(p/1000)) if p|abs >= 1000 else ('%+d W' | format(p|round(0)|int)) }}
      - obj: "p5b28" # Flèche réseau : verte vers l'icône = injection, rouge depuis l'icône = soutirage
        properties:
          "text": >-
            {% set p = states('sensor.victron_mqtt_c0619ab1db0d_grid_31_grid_power')|float(0) %}
            {% if p <= -10 %}{{ "\uE6c1" }}{% elif p >= 10 %}{{ "\uE6c2" }}{% endif %}
          "text_color": >-
            {% set p = states('sensor.victron_mqtt_c0619ab1db0d_grid_31_grid_power')|float(0) %}
            {{ '#00ff00' if p <= -10 else '#ff0000' }}   

      - obj: "p5b23" # Soutiré jour
        properties:
          "text": "{{ states('sensor.mp2_energie_soutiree_du_reseau_par_jour')|float(0)|round(1) }} kWh"
      - obj: "p5b25" # Injecté jour
        properties:
          "text": "{{ states('sensor.mp2_energie_injectee_ds_reseau_par_jour')|float(0)|round(1) }} kWh"
      - obj: "p5b27" # Tension
        properties:
          "text": "{{ states('sensor.victron_mqtt_c0619ab1db0d_grid_31_grid_voltage')|float(0)|round(0)|int }} V"

      ############### Solaire
      - obj: "p5b31" # Puissance totale
        properties:
          "text": >-
            {% set p = states('sensor.mp2_production_solaire_totale')|float(0) %}
            {{ ((p/1000)|round(2) ~ ' kW') if p >= 1000 else (p|round(0)|int ~ ' W') }}
      - obj: "p5b33" # Production jour
        properties:
          "text": "{{ states('sensor.mp2_total_energie_produite_jour')|float(0)|round(1) }} kWh"
      - obj: "p5b35" # Prévision jour
        properties:
          "text": "{{ states('input_number.mp2_memoire_estimation_production_jour')|float(0)|round(1) }} kWh"
      - obj: "p5b37" # Dont micro-onduleurs AC
        properties:
          "text": "{{ states('sensor.victron_mqtt_c0619ab1db0d_pvinverter_32_pvinverter_power_total')|float(0)|round(0)|int }} W"

      ############### Batterie
      - obj: "p5b41" # Puissance (+ charge / - décharge)
        properties:
          "text": >-
            {% set p = states('sensor.victron_mqtt_c0619ab1db0d_system_0_system_dc_battery_power')|float(0) %}
            {{ ('%+.2f kW' | format(p/1000)) if p|abs >= 1000 else ('%+d W' | format(p|round(0)|int)) }}
      - obj: "p5b48" # Flèche batterie : verte vers l'icône = charge, rouge depuis l'icône = décharge
        properties:
          "text": >-
            {% set p = states('sensor.victron_mqtt_c0619ab1db0d_system_0_system_dc_battery_power')|float(0) %}
            {% if p >= 20 %}{{ "\uE6c1" }}{% elif p <= -20 %}{{ "\uE6c2" }}{% endif %}
          "text_color": >-
            {% set p = states('sensor.victron_mqtt_c0619ab1db0d_system_0_system_dc_battery_power')|float(0) %}
            {{ '#00ff00' if p >= 20 else '#ff0000' }}            
      - obj: "p5b43" # SOC
        properties:
          "text": "{{ states('sensor.mp2_soc_affiche')|float(0)|round(0)|int }} %"
      - obj: "p5b45" # Temps restant
        properties:
          "text": >-
            {% set h = states('sensor.victron_mqtt_c0619ab1db0d_battery_277_battery_time_to_go') | float(0) %}
            {% set s = (h * 3600) | int %}
            {{ '%02d' | format(s // 3600) }}:{{ '%02d' | format((s % 3600) // 60) }}
      - obj: "p5b47" # Charge / Décharge jour
        properties:
          "text": "{{ states('sensor.mp2_energy_charge_batteries_jour')|float(0)|round(1) }}/{{ states('sensor.mp2_energy_decharge_batteries_jour')|float(0)|round(1) }} kWh"

      ############### Maison
      - obj: "p5b51" # Puissance
        properties:
          "text": >-
            {% set p = states('sensor.victron_mqtt_c0619ab1db0d_vebus_276_vebus_inverter_output_power_l1')|float(0) %}
            {{ ((p/1000)|round(2) ~ ' kW') if p >= 1000 else (p|round(0)|int ~ ' W') }}
      - obj: "p5b53" # Conso jour
        properties:
          "text": "{{ states('sensor.mp2_dess_consommation_totale_jour_vrm')|float(0)|round(1) }} kWh"
      - obj: "p5b55" # Conso 6h-22h
        properties:
          "text": "{{ states('sensor.mp2_dess_consommation_6h_22h_vrm')|float(0)|round(1) }} kWh"
      - obj: "p5b57" # Prévision conso 6h-22h
        properties:
          "text": "{{ states('sensor.mp2_dess_previ_conso_6_22_j1')|float(0)|round(1) }} kWh"

      ############### Borne VE
      - obj: "p5b61" # Puissance
        properties:
          "text": >-
            {% set p = states('sensor.evcs_hq2603jcduz_power')|float(0) %}
            {{ ((p/1000)|round(2) ~ ' kW') if p >= 1000 else (p|round(0)|int ~ ' W') }}
          "text_color": "{{ '#00ff00' if states('sensor.evcs_hq2603jcduz_power')|float(0) > 50 else '#ffffff' }}"
      - obj: "p5b63" # Etat
        properties:
          "text": >-
            {% set e = states('sensor.evcs_hq2603jcduz_status') %}
            {{ {'disconnected':'Déconnecté','connected':'Branché','charging':'En charge','charged':'Chargé','waiting_for_sun':'Att. soleil','waiting_for_start':'Att. départ'}.get(e, e) }}
      - obj: "p5b65" # Energie jour
        properties:
          "text": "{{ states('sensor.ve_sous_sol_evcs_hq2603jcduz_energy_jour')|float(0)|round(1) }} kWh"
      - obj: "p5b67" # Dernière session
        properties:
          "text": "{{ states('sensor.evcs_hq2603jcduz_last_session_energy')|float(0)|round(1) }} kWh"

      ############### Charges DC / Onduleur
      - obj: "p5b71" # Charges DC
        properties:
          "text": "{{ states('sensor.victron_mqtt_c0619ab1db0d_system_0_system_dc_consumption')|float(0)|round(0)|int }} W"
      - obj: "p5b73" # Etat onduleur
        properties:
          "text": "{{ states('sensor.victron_mqtt_c0619ab1db0d_vebus_276_vebus_inverter_state') }}"
          "text_color": "{{ '#ff0000' if states('sensor.victron_mqtt_c0619ab1db0d_vebus_276_vebus_inverter_state') in ['off','unavailable','unknown'] else '#ffffff' }}"
      - obj: "p5b75" # Charges CA (côté entrée)
        properties:
          "text": "{{ states('sensor.victron_mqtt_c0619ab1db0d_system_0_system_ac_loads_l1')|float(0)|round(0)|int }} W"
      - obj: "p5b77" # Source d'entrée
        properties:
          "text": >-
            {% set s = states('sensor.victron_mqtt_c0619ab1db0d_system_0_system_ac_active_input_source') %}
            {{ {'grid':'Réseau','generator':'Groupe','shore':'Quai','not_available':'Aucune'}.get(s, s) }}

############### Page 6 ###############
      ############### PORTE GARAGE
      - obj: "p6b11" # porte_garage. up button
        properties:
          "text_color": "{{ '#FFFF00' if is_state('cover.porte_garage', 'opening') else '#FFFFFF' }}"
          "text_opa": "{{ '80' if is_state_attr('cover.porte_garage','current_position', 100) else '255' }}"
        event:
          "down":
            - service: cover.open_cover
              target:
                entity_id: "cover.porte_garage"
      - obj: "p6b12" # porte_garage. middle stop button
        properties:
          "text": >
            {% if is_state('cover.porte_garage', 'closing') %}
            {{ "\uE4DB" | e }}
            {%-elif is_state('cover.porte_garage', 'opening') %}
            {{ "\uE4DB" | e }}
            {%-elif is_state('cover.porte_garage', 'closed') %}
            {{ "\uF11C" | e }}
            {%-elif is_state('cover.porte_garage', 'open') %}
            {{ "\uF11E" | e }}
            {% endif %}
        event:
          "down":
            - service: cover.stop_cover
              target:
                entity_id: "cover.porte_garage"
      - obj: "p6b13" # porte_garage. down button
        properties:
          "text_color": "{{ '#FFFF00' if is_state('cover.porte_garage', 'closing') else '#FFFFFF' }}"
          "text_opa": "{{ '80' if is_state_attr('cover.porte_garage','current_position', 0) else '255' }}"
        event:
          "down":
            - service: cover.close_cover
              target:
                entity_id: "cover.porte_garage"
      - obj: "p6b14"
        properties:
          "text": >
            {{state_attr('cover.porte_garage','current_position')|int(0) |round(0)}}%

      ############### PORTE SOUS SOL
      - obj: "p6b21" # porte_sous_sol. up button
        properties:
