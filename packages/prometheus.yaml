rest:
  # ============ CROWDSEC ============
  # --- Réactifs (60s) ---
  - resource: "http://192.168.0.205:9090/api/v1/query?query=sum(cs_active_decisions)"
    method: GET
    scan_interval: 60
    sensor:
      - name: "CrowdSec Bans Actifs"
        unique_id: "crowdsec_bans_actifs"
        value_template: >-
          {{ value_json.data.result[0].value[1] | default(0) | int }}
        state_class: measurement

  - resource: "http://192.168.0.205:9090/api/v1/query?query=sum(cs_alerts)"
    method: GET
    scan_interval: 60
    sensor:
      - name: "CrowdSec Alertes"
        unique_id: "crowdsec_alertes"
        value_template: >-
          {{ value_json.data.result[0].value[1] | default(0) | int }}
        state_class: measurement

  # --- Fenêtre 1h (300s) ---
  - resource: "http://192.168.0.205:9090/api/v1/query?query=sum(increase(cs_bucket_created_total{instance=%22192.168.0.206:6060%22}[1h]))"
    method: GET
    scan_interval: 300
    sensor:
      - name: "CrowdSec Scenarios Declenches 1h"
        unique_id: "crowdsec_scenarios_declenches_1h"
        value_template: >-
          {{ value_json.data.result[0].value[1] | default(0) | round(0) }}
        state_class: measurement

  - resource: "http://192.168.0.205:9090/api/v1/query?query=sum(increase(cs_parser_hits_ko_total{instance=%22192.168.0.206:6060%22}[1h]))"
    method: GET
    scan_interval: 300
    sensor:
      - name: "CrowdSec Lignes Non Parsees 1h"
        unique_id: "crowdsec_lignes_non_parsees_1h"
        value_template: >-
          {{ value_json.data.result[0].value[1] | default(0) | round(0) }}
        state_class: measurement

  # --- Compteurs lents (600s) ---
  - resource: "http://192.168.0.205:9090/api/v1/query?query=sum(cs_parser_hits_ok_total{instance=%22192.168.0.206:6060%22,source=%22/data/logs/proxy-host-2_access.log%22})"
    method: GET
    scan_interval: 600
    sensor:
      - name: "CrowdSec Domo Lignes Traitees"
        unique_id: "crowdsec_domo_lignes_traitees"
        value_template: "{{ value_json.data.result[0].value[1] | default(0) | round(0) }}"
        state_class: total_increasing

  - resource: "http://192.168.0.205:9090/api/v1/query?query=sum(cs_parser_hits_ok_total{instance=%22192.168.0.206:6060%22,source=%22/data/logs/proxy-host-17_access.log%22})"
    method: GET
    scan_interval: 600
    sensor:
      - name: "CrowdSec Immich Lignes Traitees"
        unique_id: "crowdsec_immich_lignes_traitees"
        value_template: "{{ value_json.data.result[0].value[1] | default(0) | round(0) }}"
        state_class: total_increasing

  - resource: "http://192.168.0.205:9090/api/v1/query?query=sum(cs_parser_hits_ok_total{instance=%22192.168.0.206:6060%22,source=%22/data/logs/proxy-host-14_access.log%22})"
    method: GET
    scan_interval: 600
    sensor:
      - name: "CrowdSec Matomo Lignes Traitees"
        unique_id: "crowdsec_matomo_lignes_traitees"
        value_template: "{{ value_json.data.result[0].value[1] | default(0) | round(0) }}"
        state_class: total_increasing

  - resource: "http://192.168.0.205:9090/api/v1/query?query=sum(cs_parser_hits_ok_total{instance=%22192.168.0.206:6060%22,source=%22/data/logs/proxy-host-5_access.log%22})"
    method: GET
    scan_interval: 600
    sensor:
      - name: "CrowdSec Meteo Lignes Traitees"
        unique_id: "crowdsec_meteo_lignes_traitees"
        value_template: "{{ value_json.data.result[0].value[1] | default(0) | round(0) }}"
        state_class: total_increasing

  - resource: "http://192.168.0.205:9090/api/v1/query?query=process_resident_memory_bytes{instance=%22192.168.0.206:6060%22}"
    method: GET
    scan_interval: 600
    sensor:
      - name: "CrowdSec Memoire"
        unique_id: "crowdsec_memoire"
        value_template: "{{ (value_json.data.result[0].value[1] | default(0) | float / 1048576) | round(1) }}"
        unit_of_measurement: "MB"
        state_class: measurement

  - resource: "http://192.168.0.205:9090/api/v1/query?query=sum(cs_bucket_created_total{instance=%22192.168.0.206:6060%22})"
    method: GET
    scan_interval: 600
    sensor:
      - name: "CrowdSec Scenarios Total"
        unique_id: "crowdsec_scenarios_total"
        value_template: "{{ value_json.data.result[0].value[1] | default(0) | round(0) }}"
        state_class: total_increasing

  # ============ FAIL2BAN ============
