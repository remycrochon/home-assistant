rest:
  # Paramètres mesurés à chaque prélèvement (pH, nitrates, conductivité, chlore libre, température)
  - resource: "https://hubeau.eaufrance.fr/api/v1/qualite_eau_potable/resultats_dis?code_commune=81004&code_parametre=1302,1340,1303,1398,1301&size=50&fields=code_parametre,resultat_numerique,date_prelevement,conclusion_conformite_prelevement"
    scan_interval: 86400
    timeout: 60
    sensor:
      - name: "Qualité Eau - PH"
        value_template: "{{ value_json.data | selectattr('code_parametre','eq','1302') | map(attribute='resultat_numerique') | first | float(default=0) }}"
        unit_of_measurement: "pH"
        json_attributes_path: "$.data[0]"
        json_attributes: &hubeau_attr
          - date_prelevement
          - conclusion_conformite_prelevement
      - name: "Qualité Eau - Nitrates"
        value_template: "{{ value_json.data | selectattr('code_parametre','eq','1340') | map(attribute='resultat_numerique') | first | float(default=0) }}"
        unit_of_measurement: "mg/L"
        json_attributes_path: "$.data[0]"
        json_attributes: *hubeau_attr
      - name: "Qualité Eau - Conductivité"
        value_template: "{{ value_json.data | selectattr('code_parametre','eq','1303') | map(attribute='resultat_numerique') | first | float(default=0) }}"
        unit_of_measurement: "µS/cm"
        json_attributes_path: "$.data[0]"
        json_attributes: *hubeau_attr
      - name: "Qualité Eau - Chlore"
        value_template: "{{ value_json.data | selectattr('code_parametre','eq','1398') | map(attribute='resultat_numerique') | first | float(default=0) }}"
        unit_of_measurement: "mg/L"
        json_attributes_path: "$.data[0]"
        json_attributes: *hubeau_attr
      - name: "Qualité Eau - Température"
        value_template: "{{ value_json.data | selectattr('code_parametre','eq','1301') | map(attribute='resultat_numerique') | first | float(default=0) }}"
        unit_of_measurement: "°C"
        json_attributes_path: "$.data[0]"
        json_attributes: *hubeau_attr

  # Dureté : mesurée rarement, requête séparée
  - resource: "https://hubeau.eaufrance.fr/api/v1/qualite_eau_potable/resultats_dis?code_commune=81004&code_parametre=1345&size=1&fields=code_parametre,resultat_numerique,date_prelevement,conclusion_conformite_prelevement"
    scan_interval: 86400
    timeout: 60
    sensor:
      - name: "Qualité Eau - Dureté"
        value_template: "{{ value_json.data[0].resultat_numerique | float(default=0) }}"
        unit_of_measurement: "°f"
        json_attributes_path: "$.data[0]"
        json_attributes: *hubeau_attr